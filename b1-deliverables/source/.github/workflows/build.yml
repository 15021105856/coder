name: Validate and build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y zip unzip fonts-wqy-zenhei
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: training-system-v7
          path: release/
