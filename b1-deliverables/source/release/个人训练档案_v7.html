率沿用 8 月 20 日决定，只记录、不解读。`,caption:`当前观测与参照`,head:[`指标`,`最近观测`,`参照或说明`],rows:[[`华为夜间 HRV`,`94 ms，10 月 6 日`,`当日设备区间 83–118 ms`],[`平均睡眠心率`,`50 bpm，10 月 6 日`,`当日设备区间45–51 bpm；夜间45–72 bpm`],[`睡眠时长`,`421 分钟`,`消费级睡眠记录，分期不作为独立恢复判据`],[`SpO₂与呼吸频率`,`98%；15 次/分`,`10 月 6 日设备平均值`],[`Elite 晨起 RMSSD`,`88.03 ms，9 月 24 日`,`之后缺测，不沿用成当天值`]]},s2:{title:`7.2 固定参考期`,text:[`Elite 参考窗口锁定为 2026 年 8 月 8 日至 8 月 23 日，排除 8 月 16、17 日，n=14。lnRMSSD 均值 4.4417，样本标准差 0.0935；常态带 77.3–93.2 ms，离群线 73.8 / 97.7 ms。每日追加数据不改变参考窗口。该范围是个人历史描述，不能单独诊断恢复、疲劳或疾病。`,`原始记录保留与统计纳入分开处理。带备注的记录照常保留，但固定基线严格执行既定日期与排除清单；不因 flag 存在而删除，也不因保留而自动纳入。`],figCaption:`参考期 16 天的 Elite 晨测：14 个纳入样本与 2 个排除日`},s3:{title:`7.3 数据来源和估计标识`,text:[`训练数据集是数值唯一来源。data保留原32字段；可选_daily按日期保存体重、逐课训练、睡眠补充和营养范围。历史未结构化的细节仍在flag中，缺少_daily并不表示没有记录。HTML显示器接受完整数据集导入，并将补充记录随JSON导出。`,`营养以代表值配合范围呈现。饱腹感、食物照片和碗数能够改善估计，但不能替代称重和配方；不把估值与运动手表热量简单相减后宣称盈余。`]}},ze={principles:[[`服务备考`,`日常训练服务于备考。体感与实际表现是重要背景，客观指标用于补充；不为验证假设要求额外测试或改变训练。`],[`分清三类信息`,`区分事实、设备估计与解释。朋友在场不等于该组受助；未报告训练不等于休息；未报告症状不等于确认无症状。`],[`一次不成因果`,`一次变化不建立因果。多个候选因素同时变化时，不把时间上的先后自动写成已验证机制。`],[`先分组再比较`,`不同设备、统计窗口和采集协议先分组再比较。普通备注不属于异常标记；跑姿、HRR、HRV 和设备恢复时间均不单独裁决整体恢复。`],[`关上的门不重开`,`关闭的观察不主动重启。8 月 20 日起功率不解读；10 月 2 日用户已关闭本轮头痛事件的主动追问。`]],review:{caption:`旧版论断审阅队列`,head:[`旧版说法`,`问题`,`建议`],rows:[[`HRR 作为外周疲劳指标；HRV 作为 CNS 压力来源判据`,`由单项指标推向特定组织或中枢机制，证据层级跨越`,`保留读数，机制解释待原始文献复核`],[`睡眠心率同降即可把 RMSSD 下降判成测量波动`,`两项同向不足以排除其他解释`,`页面只描述变化，不自动认定病因`],[`短睡与深睡加权解释华为 HRV 偏高`,`设备算法与分期权重没有在当前材料中得到确认`,`历史假设存档，不当当前测量原理`],[`跟腱长度、跑鞋回弹或功率差解释能力优势`,`个体量测与产品数值的来源和条件不完整`,`将测量、产品参数与推断分别核对`],[`5 km 全力预测、阈值和未来配速目标`,`预测与实测混排，部分测试长期未完成`,`预测保留历史；新计划等明确需要时再制定`]],foot:`上表列出的是证据与表达问题，并未完成新一轮系统文献审查。旧版完整推演已冻结存档。附录 B 保留当时的核实记录，可用于后续逐篇复核，不因重新排版而提高证据等级。`},symptoms:[`9 月 29 日出现头痛伴短暂视觉异常，9 月 30 日明显缓解，10 月 1 日用户确认头痛消失；未就医、未建立正式诊断。10 月 2 日用户要求此事翻篇，关闭主动追问。完整经过留在数据集及历史存档，日常首页不重复展示。`,`既往右肩、左膝等记录按历史时点保留。旧版的限制、已解除项目和待测试条件不自动升级为今日状态；有新的用户反馈再更新对应事件。`]},Be={goals:[`当前主线是 2026 年 12 月北京大学体育硕士 346 备考。训练以维持日常状态为主要安排，同时关注用户提出的增重目标。无新增强制测试、称重或数据采集任务。`,`考研后 5 km/10 km 专项发展、力量与体重目标保留为远期意向；旧版具体配速、80–100 km 周量及双阈值设想见历史存档，不作为当前处方。`],boundary:[`本档案是单人观察记录，沿用论文式的信息组织与编号图表，但不是试验研究或临床诊断。数值变化用于描述，个人经历与既有文献的适用边界需要分别核对。`,`更新时先录入数据集，再同步 HTML 和本档案；正文维护近期 14–21 天索引、当前状态和稳定记录原则。完整动作和长备注保留在数据层，旧推演保留在冻结历史存档。附录 B 维持原始文字，任何重新核实结论另写日期与依据。`]},V={intro:`以下为既有维持计划的历史参考。实际完成的动作和频次以逐日记录为准。`,head:[`动作`,`组数 × 次数`,`关键点`],days:[{name:`腿日`,note:``,caption:`既有计划 · 腿日`,rows:[[`杠铃深蹲`,`4 × 8`,`主项，保重量，RIR 2–3`],[`杠铃硬拉`,`3 × 6`,`主项，组间休息 3 min`],[`腿弯举`,`3 × 12`,`腘绳肌孤立`],[`联动髋外展`,`3 × 15`,`臀中肌，跑步侧向稳定`],[`平板 + 动态死虫`,`各 3 组`,`核心收尾（超集）`],[`面拉（优先）`,`2–3 × 12–15`,`固定收尾 (28–32 kg)`]]},{name:`背日`,note:`优先级最高：不可跳过或缩减`,caption:`既有计划 · 背日`,rows:[[`器械辅助引体`,`4 × 8`,`主项，从高辅助递增至低辅助`],[`悍马划船(单侧)`,`4 × 8`,`弱侧(左)先做，强侧跟随匹配`],[`轻量 RDL`,`2–3 × 10`,`传统硬拉 60–65%重量，背部等长刚性`],[`YTWL(上斜凳)`,`2 × 各 6 次`,`1–2 kg 或空手，肩胛骨稳定黄金组合`],[`单臂面拉(左侧)`,`3 × 12`,`只做左手，专项矫正左右不对称`],[`收下巴`,`2 × 10 次`,`停 5 秒，深层颈屈肌激活，矫正头前倾`],[`面拉（优先）`,`3 × 15`,`固定收尾（背日加组至 3 组）`]]},{name:`胸日`,note:`胸肩合并，优先级最低，时间紧可压缩至 30 分钟`,caption:`既有计划 · 胸日`,rows:[[`杠铃卧推`,`4 × 12`,`主项，胸肩合并期降重量，RIR 2–3`],[`上斜推胸`,`3 × 12`,`-`],[`器械推肩`,`3 × 12`,`三角肌前中束`],[`侧平举`,`3 × 12`,`胸肩合并期固定保留，时间紧可缩至 2 组`],[`面拉（优先）`,`2–3 × 12–15`,`固定收尾`]]}]},Ve=`以下为既有文献核实记录的原文保存，文字与上一版一致。本次只调整排版与导航，未重新核实其文献细节。文中的旧§7指冻结版本核心生理认知，现行分析原则见第 08 章。`,He=`《训练历史存档.md》保存 2026 年 10 月 3 日重构时迁出的旧版完整叙述：运动员卡、旧第 1–13 章、旧近期训练链与核心生理认知等。全文原样内嵌，只做排版与检索，不改一字；它是冻结材料，不代表当前训练处方或已验证结论，旧章节号均指冻结版本。`;`${n.archive}`;var H={caption:`文件职责`,head:[`文件`,`职责`],rows:[[`训练数据集.json`,`原始字段与 _daily 补充；唯一数值来源（天数随 data 末行）`],[n.monitor,`本地查看、趋势、导入导出；不替代数据集`],[n.archive,`本档案的交互版：同一份正文，图表由内嵌数据集实时生成`],[n.docx,`当前状态、近期索引、方法与参考资料（可打印、可批注）`],[`训练历史存档.md`,`冻结的旧版完整叙述；原文内嵌为网页版附录 D，可全文检索，不再每日追加`],[`系统重构审阅.md`,`问题、已实施改动、待复核建议与验证结果`],[n.rules,`更新纪律、重构执行约定与当前界面的数据更新注意事项`]],foot:`data仍使用原32字段，不改变历史日期及原始值。_daily为可选补充，含weight、sleep、sessions、day_totals、nutrition及hrr。缺失字段表示未结构化或未报告，不自动补零。`},Ue={intro:[{kind:`body`,text:`以下为既有文献核实记录的原文保存，文字与上一版一致。本次只调整排版与导航，未重新核实其文献细节。文中的旧§7指冻结版本核心生理认知，现行分析原则见第6章。`},{kind:`body`,text:`本附录为8月8日档案瘦身时从§7迁出的文献核实全文，内容一字未删。迁出理由：§7的定位是"能反复用来指导未来训练决策的规律"，而这三块是支撑那些规律的参考资料，留在主线上会稀释决策密度。§7对应小节已保留结论索引与出处，需要查证原始核实要点、原作者自述局限时来此。维护提示：本附录只增不改；`},{kind:`body`,text:`若某条文献结论被新证据推翻，修正应写在§7对应小节并注明日期，此处保留当时的核实记录，不做静默覆盖。`}],articles:[{title:`晨起单点HRV偏低的机制与睡眠惯性——三篇原始文献核实（7月19日）`,blocks:[{kind:`lead`,text:`背景：`},{kind:`body`,text:`7/19出现与7/15方向相反的设备背离（华为整夜98ms高、Elite晨起单点68ms偏低），同时主观有"睡不够感"但身体DOMS已消失、疲劳减轻。经三篇原始文献核实，该现象有两条独立机制支撑，分别解释"单点HRV偏低"和"睡不够但不累"。`},{kind:`body`,text:`机制一·晨起测量卡在睡眠→清醒过渡期的一过性交感激增。`},{kind:`item`,text:`① Boudreau et al. 2012（Chronobiology International, 29(6):757-768）是最贴合本场景的直接证据：72小时强制去同步方案分离睡眠-觉醒效应与昼夜节律效应，发现清醒相比小睡，LF/HF与LF功率显著升高、HF（副交感）显著降低、心率平均高6.5bpm；`},{kind:`body`,text:`且LF/HF峰值恰在早晨、与唾液皮质醇峰值重合，清晨睡→醒转换是全天交感激活转变幅度最大的时点。这解释了晨起单点RMSSD为何特别容易被拖低——不仅是"觉醒"动作本身，还叠加清晨时段的昼夜节律因素。局限（原作者自述）：LF/HF非纯交感指标、仅反映交感迷走平衡；`},{kind:`body`,text:`样本量13人、统计功效有限——与本档案"单日LF/HF噪声大、不单独下结论"一致。`},{kind:`item`,text:`② Somers et al. 1993（N Engl J Med, 328:303-307）是方法学最硬的奠基证据（微神经图直接测交感放电，非HRV间接推算），证实觉醒刺激在睡眠背景下会引发交感激增（其主线发现为REM期交感飙升至清醒水平215%）；但属机制奠基，未直接测量"晨起单点HRV被拖低多少"这一具体数值。`},{kind:`body`,text:`机制二·"睡不够感"是睡眠惯性(sleep inertia)而非身体疲劳，两套系统独立。`},{kind:`body`,text:`Tassi & Muzet 2000（Sleep Medicine Reviews, 4(4):341-353，该领域顶级综述，被引超450次）核实要点：醒来前的睡眠阶段是决定睡眠惯性强度最关键的因素——从深睡(SWS/N3)猛然醒来惯性最强、从N1/N2浅睡几乎无惯性、REM居中；`},{kind:`body`,text:`正常8小时无睡眠剥夺时惯性一般不超过30分钟（Jewett 1999发现主观警觉度完全恢复可能需2小时）。这与本档案7/12"晨起主观40%→活动后80%"的恢复曲线在时间尺度上吻合。边界：该综述明确指出"睡眠惯性是否有昼夜节律尚无直接证据"，与机制一的HRV昼夜节律是两个独立机制，不可混为一谈。`},{kind:`lead`,text:`操作结论：`},{kind:`body`,text:`晨起Elite单点RMSSD偏低、但华为整夜均值高位且睡眠结构/主观恢复正常时，优先判定为"测量时机落在觉醒过渡期"的技术性拖累，不判定为真实疲劳；"睡不够但不累"是睡眠惯性（认知系统恢复滞后于身体），起床后活动20-30分钟自然消散，不影响训练决策。此结论与机制二的系统区分一致。`}]},{title:`睡眠与运动员：BMJ 2021专家共识核实要点（7月26日新增）`,blocks:[{kind:`lead`,text:`来源：`},{kind:`body`,text:`Walsh NP, Halson SL, Sargent C, et al. "Sleep and the athlete: narrative review and 2021 expert consensus recommendations." Br J Sports Med 2021;55:356-368. doi:10.1136/bjsports-2020-102025。`},{kind:`body`,text:`BMJ运动医学专家共识，作者含Liverpool John Moores、澳洲天主教大学等多国机构。以下为与本档案直接相关的核实要点，含原文自述局限。`},{kind:`item`,text:`① 睡眠结构常模（PSG金标准）：年轻成年人7-9小时睡眠约含61%浅睡、16%深睡、23%REM；15岁青少年8-10小时约含57%浅睡、22%深睡、21%REM。本档案对照：华为的浅睡参考线设为<55%，比该文献常模更严格，61%浅睡按常模属年轻成年人典型值；本人深睡长期20-35%，显著高于16%常模（利好）；`},{kind:`body`,text:`但REM近期多次落在8-12%（7/24=10%、7/26=9% Low），明显低于21-23%常模，而华为因参考区间设为10-30%而标注Normal——即REM才是当前偏离常模最明显的一项，与记忆巩固/情绪调节相关，对备考期意义大于浅睡百分比。`},{kind:`body`,text:`重要限定：该常模来自多导睡眠图(PSG)，而本档案数据来自腕戴设备，论文表1明确指出此类设备不能准确测量睡眠分期，故两者不可直接横比，此对照仅用于说明"浅睡61%无需焦虑"，不足以反推分期数值的绝对准确性。`},{kind:`item`,text:`② 消费级可穿戴设备的系统性偏差（论文表1）：不能准确测量睡眠分期（除经专门验证）；系统性高估总睡眠时间与睡眠效率，同时低估觉醒次数与入睡后觉醒时间(WASO)；多数设备不公开算法、不提供原始数据；大量设备缺乏充分验证。`},{kind:`body`,text:`本档案含义：华为的睡眠分期百分比，参考价值低于其HRV趋势（后者至少为连续量，前者是算法分类结果），进一步支持已有的"华为看趋势、Polar H10+Elite HRV看当天锚点"两轨协议。`},{kind:`item`,text:`③ 睡眠不足与呼吸道感染易感性：论文引用Cohen 2009等指出，习惯性睡眠<7小时增加呼吸道感染易感性，且睡眠不足会降低疫苗保护性免疫反应；另引Hausswirth 2014指出，存在过度反应(over-reaching)客观征象的运动员，上呼吸道感染发生率高于未过度反应者。`},{kind:`body`,text:`本轮感冒(7/21晚起病)的回溯对照：起病前多夜睡眠不足7小时（7/17=6h40、7/20=6h57、7/21=6h51），入睡时间连续偏离23:00-23:30目标窗口；且7/17背日额外加练递增硬拉、7/18出现HRV跌破下限+觉醒High+LF/HF升高三线同向报警、7/19仍带残留疲劳完成含情绪性冲刺的10km。`},{kind:`body`,text:`判定：受凉是明确的直接扳机，但"睡眠持续不足+训练负荷偏高+自主神经已报警"这一组合恰好构成文献描述的易感窗口，是比单一受凉更完整的解释。此为回溯性关联，非确证因果。`},{kind:`item`,text:`④ 傍晚训练与入睡延迟的结构性关联：论文指出傍晚(18:00-21:00)高强度训练/比赛通常伴随更晚的入睡时间、更短卧床时间与更少总睡眠；并指出核心体温下降或处于低位时最易入睡，体温上升或偏高时最难入睡。`},{kind:`body`,text:`本档案对照：跑步固定18:00-18:30出发，而入睡时间连续两周稳定在00:01-00:42、无一日落入23:00-23:30目标窗口。推论（尚未验证）：训练时间安排可能是入睡时间长期偏晚约1小时的结构性原因之一，而非单纯自制力问题；若日程允许，将跑步时间前移可能比"晚上早放手机"更有效（后者已试过，结果为躺床挣扎近1小时）。`},{kind:`body`,text:`论文另建议顺应个人时型(chronotype)安排训练与睡眠，并指出夜型者睡眠更易受困扰、早训会减少睡眠时长并升高训练前疲劳——本人作息偏夜型（稳定午夜入睡、8点左右自然醒），故清晨力量课未必是最优时段。备考期日程受图书馆开放时间约束，此条属可选优化项。`},{kind:`item`,text:`⑤ 午睡协议（Tool #3，可直接执行）：时长≤30分钟以避免进入深睡后产生睡眠惯性；最佳窗口13:00-16:00（对应午后警觉度低谷）；"咖啡午睡"为睡前即刻摄入150-200mg咖啡因再睡15-20分钟（咖啡因起效约20-30分钟，恰在醒时生效）；醒后接触明亮光线+洗脸可加速消除惯性；`},{kind:`body`,text:`定闹钟时比目标时长多留约10分钟以计入入睡时间。关键例外：若本身存在夜间入睡困难，应完全避免午睡。`},{kind:`item`,text:`⑥ 咖啡因截止时间：论文引用一项涵盖58篇文献的系统综述，指出典型剂量咖啡因即使在睡前16小时摄入，仍对睡眠产生一致负面影响——延长入睡时间(SOL)、减少总睡眠时长与睡眠效率、减少慢波睡眠(深睡)、增加浅睡与觉醒。实操：16小时标准对备考期不现实，但可作为排查工具——若某日入睡异常困难，回查当日咖啡因摄入时间。`},{kind:`item`,text:`⑦ Banking sleep（Tool #4，考研可用）：在预期睡眠不足期之前主动延长睡眠可能保护表现；一项大学篮球运动员研究显示连续5-7周每晚卧床10小时改善了反应时、冲刺、情绪与罚球命中率；论文指出储蓄睡眠不必持续数月，即使1周亦被证明可改善表现，且其价值之一是缓解赛前焦虑（知道前期睡够，就不会因赛前一晚没睡好而慌）。`},{kind:`body`,text:`迁移到考研初试：考前1-2周主动拉长睡眠，比考前一晚临时要求自己"必须睡好"更可靠（后者常适得其反）。局限（原文自述）：此类研究常缺对照组，且无法区分是"真正储蓄睡眠"还是"仅偿还既有睡眠债"。`},{kind:`item`,text:`⑧ 监测设备的心理副作用（Box 3第5条）：论文警示部分运动员会过度关注睡眠监测数据，反而增加睡眠焦虑并导致睡眠更差，引用Baron等2017年提出的"Orthosomnia"（为追求完美睡眠评分而产生的睡眠焦虑，本身成为失眠诱因）。`},{kind:`body`,text:`本档案适用性评估（经7月26日讨论修正）：初次评估曾据此提示本人可能存在该倾向，但被有效反驳并已收回大部分——真正被数据焦虑支配者不会在HRV未崩、症状明确指向"应停"时仍连续两日坚持训练（7/23、7/25），本人模式为"数据驱动而非以数据为导向"，决策权始终在本人手上、有时压过数据与建议。`},{kind:`body`,text:`保留的可用部分：论文建议实践者权衡监测利弊并有能力调整反馈方式——落地做法是忽略华为的"睡眠评分"与自动标红提示，只看档案自定义指标（HRV相对个人基线偏移、深睡连续性、觉醒次数），减少无关信息干扰。`},{kind:`item`,text:`⑨ 浅睡偏高的归因修正（7月26日讨论）：初次分析将本轮浅睡偏高主要归因于"华为阈值比常模严格"，被指出遗漏两个更近因的混杂变量——感冒期气道不适/夜间黏膜干燥打断睡眠连续性、贵阳夜间高温破坏既有热环境入睡适应（7/23已明确记录"有点热、挣扎近1小时方入睡"）。`},{kind:`body`,text:`但反向核查发现：7/16轻睡61% High、7/20轻睡68% High，两次均发生在7/21晚起病之前，说明浅睡偏高在病前已间歇出现，非本轮感冒独有。修正后结论：本人存在一个偏高的浅睡基线（大概率与入睡时间稳定偏晚相关），感冒与高温在此基线上叠加了一层，三者共同作用。`},{kind:`body`,text:`此修正不改变"无需为61%焦虑"的结论，但不能简化为单一的阈值问题。`}]},{title:`HRV的自主神经与情绪调节理论基础（五篇原始文献核实，7月21日）`,blocks:[{kind:`lead`,text:`背景与边界：`},{kind:`body`,text:`应用户备考需要，核实了五篇HRV基础文献原始PDF全文（非二手转述）：Appelhans & Luecken 2006（Review of General Psychology, 10(3):229-240）、Porges 2007《The Polyvagal Perspective》（Biological Psychology, 74:116-143）、Thayer & Lane 2000《A model of neurovisceral integration》（Journal of Affective Disorders, 61:201-216）、Kreibig 2010《ANS activity in emotion: A review》（Biological Psychology, 84:394-421）、Laborde, Mosley & Thayer 2017（Frontiers in Psychology, 8:213）。`},{kind:`body`,text:`关键定位（避免张冠李戴）：这五篇属于"HRV作为自主神经/情绪调节指标"体系，回答的是"设备测的这个数本质是什么、机制在哪、怎么测才准"，不是"该怎么练"。训练量决策仍属另一支运动科学文献（Buchheit / Plews / Le Meur一脉，本档案§7其他小节已在用），两个体系不可混用。`},{kind:`body`,text:`本小节不推翻既有认知，而是给档案里若干分散的机制注脚补上统一的理论根系。`},{kind:`lead`,text:`机制根系一·前额叶抑制回路（Thayer神经内脏整合模型，争议小、被脑成像反复验证）：`},{kind:`body`,text:`HRV反映的是"前额叶皮层→中枢自主网络（CAN：前扣带回/岛叶/杏仁核/下丘脑→孤束核/疑核/延髓腹外侧区）→迷走神经→心脏"这条抑制性负反馈回路的完整性。前额叶通过该回路对心脏和杏仁核施加张力性抑制；抑制运转良好时执行功能/情绪调节/应激恢复更佳，回路被削弱（疲劳、担忧、急性应激）时交感"脱抑制"冒出、HRV下降。`},{kind:`body`,text:`这条直接解释了本档案反复观察到的"心理应激能独立于肌肉疲劳压低HRV"（如6/27母亲手术32ms、7/20电话应激）——心理应激直接占用/削弱前额叶抑制回路本身，故可完全独立于任何外周肌肉疲劳去压低HRV。`},{kind:`body`,text:`Kreibig 2010从情绪特异性角度佐证：情绪状态确有可测量的自主神经印记，故"心理应激污染样本"有实证基础而非主观臆断。`},{kind:`lead`,text:`机制根系二·光电vs ECG的脉搏传导时间机制（补强既有"光电vs ECG测量差异"小节，Laborde 2017）：`},{kind:`body`,text:`PPG（光电，华为Watch 5原理）测的是脉搏波到达外周的时间，即脉搏间期=心搏间期+脉搏传导时间（PTT）；ECG（Polar H10原理）直接抓R波，无此混入。关键：应激会改变动脉弹性→改变PTT→污染PPG读数，因此PPG在静息可用、在应激/冲刺状态下不可靠。`},{kind:`body`,text:`这为本档案既有的"两设备在冲刺/回落瞬间偏离最大、稳态时接近"提供了独立于"算法平滑滞后"的第二重机制解释：不只是光电算法平滑，还有PTT在应激下被生理性污染。原文并给出RMSSD精度对照——胸带ECG对比金标准误差约2.16%，腕部PPG约17.49%，与本档案两轨并行协议底层精度依据一致。`},{kind:`lead`,text:`机制根系三·LF/HF"交感-迷走平衡"说已被否定（补强既有Elite HRV解析规则，Porges 2007 / Billman 2013 / Eckberg 1997，Laborde 2017转述）：`},{kind:`body`,text:`LF对阿托品（迷走阻断）极度敏感，阻断迷走可几乎消除LF——若LF为纯交感标志，不应被迷走阻断消掉；且LF与交感神经活动关系松散，交感与迷走呈非线性、非互反关系，单一比值无法干净表征"平衡"。Laborde指出约65%的HRV论文仍在错误地基于LF/HF下结论。`},{kind:`body`,text:`据此对既有措辞做收紧（结论不变、机制叙述更严谨）：涉及7/20 LF/HF=4.54的解读，表述宜从任何"交感主导"暗示改为"一次强烈的自主神经扰动事件"，不指定具体通路；本档案既有"LF/HF仅看长期趋势、不解读单日值"的立场因此获得权威背书，继续保持。`},{kind:`lead`,text:`机制根系四·呼吸不做常规校正（Laborde 2017 / Thayer 2011）：`},{kind:`body`,text:`静息自然呼吸下不对HRV做常规呼吸校正——呼吸与HRV有共同中枢神经起源（脑干心肺耦合），强行减去呼吸影响会连带删掉真正关心的神经变异；但需监测呼吸落在9–24次/分（对应HF 0.15–0.40Hz）区间内，呼吸过慢（如慢呼吸<9次/分）会把变异推入LF频段、使HF不再等于迷走张力。本档案晨测采自然呼吸，与此一致；`},{kind:`body`,text:`附带确认RMSSD受呼吸影响小于HF，故以RMSSD为核心锚点的选择在方法学上稳健。超短时长补充：Munoz 2015（N=3387）显示测RMSSD无需超过120秒，单次10秒标准ECG即可得有效RMSSD（多段取平均更佳）——仅对时域RMSSD成立，频域仍需≥1分钟。`},{kind:`lead`,text:`实测案例（8月1日）：`},{kind:`body`,text:`晨测时因sleep inertia未消退，用户主动进行了缓慢深呼吸，导致LF peak降至0.059Hz（约3.5次/分，远低于9-24次/分的正常呼吸范围），变异被人为推入LF频段，SDNN(119.23ms)/TP(8809.36ms²)/LF同步虚高失真，Elite App据此给出的"副交感异常升高、建议减量"提示不可信；`},{kind:`body`,text:`RMSSD受呼吸影响较小，仍保持在基线中段，作为该次测量中相对可用的指标。操作结论：晨测前若有意放慢呼吸（无论是为平静情绪还是巧合），当日频域指标（LF/HF、LF peak、SDNN、TP）应整体降权或不采信，只用RMSSD参考基线位置。`},{kind:`body`,text:`关键局限与警示（按维护规则保留原文边界，不只写支持性结论）：`},{kind:`item`,text:`① Porges多迷走理论在生理学界非定论——腹侧/背侧迷走二分、"社会参与系统"、RSA=纯疑核迷走输出等理论建构受过实质批评（最有力批评之一Grossman & Taylor发于同卷Biol Psychol 74）；其"迷走刹车/迷走撤除先于交感"等功能性描述可用，但演化等级类建构不宜当作已证事实。`},{kind:`item`,text:`② Thayer与Porges在HF/LF解读上存在分歧（Thayer传统上倾向HF=纯迷走、有时谈LF/HF平衡；Porges论证LF亦迷走驱动、平衡说不成立）——本档案"LF/HF只看长期趋势"恰卡在两派分歧中间，为最稳妥立场，不因Thayer框架而回头重度解读单日LF/HF。`},{kind:`item`,text:`③ "HRV越高越好"错误，五篇再次确认（Laborde举神经性贪食症患者因低代谢率反而HRV偏高为例），与本档案7/13"HRV升高≠恢复更好、功能性过度训练副交感异常偏高"同向——高HRV须结合睡眠结构/静息心率/主观体感联合判断，不孤立追高。`},{kind:`item`,text:`④ 新角度（Park 2014，Laborde转述）：张力性（tonic，晨起基线）迷走张力会调节相位性（phasic，任务中）迷走撤除模式，即晨起基线水平影响当天身体应对训练刺激的调节方式——为"晨起HRV高则有余量吸收刺激"的决策哲学提供更精细支点，可作后续观察方向。`}]}]};function U(e){return!e||e===`未记录`?`none`:e.includes(`休息`)?`rest`:e.includes(`双练`)||/有氧|跑/.test(e)&&/背|腿|胸|肩|力量|核心/.test(e)?`mix`:/有氧|跑|阈值|间歇/.test(e)?`run`:e.includes(`球`)?`ball`:`str`}var We={run:`跑步`,str:`力量`,mix:`同日多课`,rest:`休息`,ball:`球类`,none:`未报告`};function W(e,t){return ge(e,t?.[e.d])}function Ge(e,t){return _e(e,t?.[e.d])}function Ke(e){let t=(e.data||[]).slice().sort((e,t)=>e.d<t.d?-1:1),n=e._daily||{},r=new Map(t.map(e=>[e.d,e])),i=e=>e.length?e.reduce((e,t)=>e+t,0)/e.length:null,a=t.map(e=>U(e.type)),o=(...e)=>a.filter(t=>e.includes(t)).length,s=t.map(e=>W(e,n)).filter(e=>Number.isFinite(e)&&e>0),c=t.map(e=>Ge(e,n)).filter(Number.isFinite),l=t.map(e=>e.dur).filter(Number.isFinite),u=t.filter(e=>e.dur!=null).reduce((e,t)=>!e||t.dur>e.dur?t:e,null),d=t.reduce((e,t)=>{let r=W(t,n);return Number.isFinite(r)&&(!e||r>e.km)?{d:t.d,km:r}:e},null),f={days:t.length,first:t[0]?.d,last:t.at(-1)?.d,runDays:o(`run`,`mix`),runKmDays:s.length,runKm:s.reduce((e,t)=>e+t,0),strengthDays:o(`str`,`mix`),restDays:o(`rest`),unreported:o(`none`),totalVol:c.reduce((e,t)=>e+t,0),sleepAvg:i(l),hwAvg:i(t.map(e=>e.hw).filter(Number.isFinite)),elN:t.filter(e=>e.el!=null).length,longestSleep:u?{d:u.d,dur:u.dur}:null,longestRun:d},p=e._baseline||{},m=new Set(p.excluded||[]),h=t.filter(e=>e.el!=null&&e.d>=p.window_start&&e.d<=p.window ##   6    近期训练链条

### 9月10日–10月2日｜训练中不适与恢复记录

HRR 口径偏倚，由用户提出，成立：本次起测点 149 是全部 17 次里最低的（此前范围 153–169）。现行口径是掉幅÷起测点，分母含静息那一段，起测点越低可下降空间越小，百分比被系统性压低。改按心率储备口径（掉幅÷(起测点−静息 50)）重算全序列后排名基本不变——本次 29.3% 仍为倒数第二，但与 9/8 的 29.9%、9/3 的 30.4% 差距缩到 1.2 个百分点以内（原口径下分别是 19.5%、21.0%、21.0%）。方向不变，确定性下降。记为现行 HRR 口径的已知偏倚：起测点低于 155 时该值偏低，引用须注明。心率 136 也不单独归因于气温：档案换算 24→17°C 约 −8bpm，确能解释与 9/8（5:58／142）的大部分差异，但同日 HRR 为倒数第二，心率低与恢复慢并存，不支持「今天凉快所以轻松」这一单一解释。

本周结论　配速下降优先核查摄入是否达标，其次才是疲劳。补给粉不可替代正餐。

##   7    核心生理认知

### 并行训练干扰效应（表型选择性模型，2026修正）

干扰效应是表型选择性的，不是二元开关：最大力量（SMD −0.06）与肌肥大（SMD −0.01）几乎不受影响，唯独爆发力/功率被显著削弱（SMD −0.28）。原"力量激活mTOR、耐力激活AMPK、两者相互拮抗"的模型不成立——真实机制是残余疲劳、核糖体生成与线粒体生成的能量带宽竞争、神经募集效率下降等多因素叠加；转录组学证据（Zhao 2026）显示并行训练反而下调了泛素-蛋白酶体系统、抑制了肌生长抑制素，分子层面并没有"有氧锁死增肌信号"这回事。（Schumann 2022／Held 2026／Zhao 2026，7月10日核实）适用边界：仅适用于产生真实机械张力/代谢应激的抗阻训练（如 ≥70%1RM 复合动作），不适用于姿态神经再教育课那类刺激（弹力带＋3kg哑铃＋自重核心、均心率103bpm），后者不构成两条通路竞争的前提。本人实测：停止下肢重训后 HRV 由 83-89ms 持续攀升至 111ms，下肢重训是 HRV 最大的单一 CNS 压力源。2025年11月纯 LSD 特化期 HRV 94ms、触地203ms、80%强度3:32/km 无疲劳感；2026年双线并行则换来更强的功率上限与后链力量储备。

### 并行训练操作性指导（基于三文献实证）

真正的抗阻训练日与跑步质量课同天时：①间隔≥3小时可显著降低对爆发力的同日干扰(Schumann)，≥6小时进一步降低残余疲劳(Chen 2024)，理想情况下最耗神经的力量课与最耗强度的跑步课分开不同天；②同日无法避免时，力量课放在前面对力量/肌肥大保护更有利(Eddens 2018；Held的RT-before-ET趋势SMD 1.69/0.83，但p值未达显著，视为合理默认而非铁律)，若当天有关键阈值跑/比赛配速跑等优先级更高的跑步课，则应反过来先跑后力量；③力量训练维持重负荷低次数(≥80%1RM)对跑步经济性有小幅正向帮助(Llanos-Lagos 2024)，不是纯粹拮抗，与现在的维持计划方向一致；④爆发力/增强式动作对干扰最敏感，应安排在身体最新鲜(未受疲劳影响)的状态下进行。

### "换挡感"与摄氧量动力学

提速后氧亏窗口→心肺追上→有氧系统接管→心率回落、主观变顺。是热身完成最可靠信号。凉爽天气（23°C以下）换挡更清晰——散热不竞争心输出量。高温时换挡过程混沌延长。比赛热身必须等此感出现再执行PAP。

### PAP（赛后激活增强效应）

高强度收缩后肌球蛋白轻链磷酸化升高→同等神经信号触发更强收缩，持续8-15分钟。黄金窗口：激活后休息8-12分钟。

比赛热身流程（PAP 激活）

| 步骤 | 动作 | 要点／时长 |
|---|---|---|
| 1 | 慢跑热身 | 慢跑至出现「换挡感」（有氧系统接管信号：心率回落、主观变顺） |
| 2 | PAP 激活 | 3–4 组 100m 渐进加速（触发肌球蛋白轻链磷酸化） |
| 3 | 休息激活窗口 | 8–10 分钟（黄金窗口 8–12min；PAP 效应持续 8–15min） |
| 4 | 出发 | 正式起跑 |

### 超量恢复机制

刺激→功能下降→超量补偿→能力高于训练前→无新刺激则回落。峰值通常在刺激后5-7天。"闲不住"感是急性神经兴奋性峰值（48h消退），HRV代表的ANS深层储备（平静的充裕）可持续数天。4月17日100ms和4月30日111ms分别验证了这个模型。关键教训（4月18日）：峰值当天应立刻执行测试，而非严格遵守日历。

### 衣物/温度对心率的影响

4月21日自然实验：相同配速6:20/km，穿加绒长袖→心率144bpm，脱掉→135bpm（差9bpm）。机制：散热与骨骼肌供氧竞争心输出量。比赛应用：气温升高时心率系统性偏高，应以RPE而非绝对心率为配速参照。

### 糖原耗竭与撞墙机制

5月7日模拟赛实测：第15km配速从4:13/km跌至4:46/km（慢35秒），但心率从168bpm同步降至162bpm——"配速降+心率降"是周边性疲劳的典型指纹，证明限制因素是糖原底物而非心血管能力。补充160g面包后配速立即恢复至4:11-4:14/km。结论：你的有氧引擎足够强，但需要持续供给燃料。三颗能量胶方案直接针对这个问题。

### 结缔组织适应 vs 肌肉适应（新鞋适应期核心认知）

渐进负荷、留恢复窗口、试探当前阈值——这套逻辑对肌肉和结缔组织通用，但两者适应机制有本质区别。肌肉的疲劳信号是实时、剂量依赖、可预测的：DOMS在24-48h内如约而至，可作可靠的实时刻度，允许"推到有感觉再退一步"。但足底筋膜、跟腱这类结缔组织的胶原蛋白代谢周期以周甚至月计，损伤信号非线性、常"沉默积累后突然爆发"——今天无感不代表没有微损伤累积（Adios 9右脚"昨天撕裂痛今天零感觉"、飞电6C首跑后跟腱紧绷均为此机制）。实操含义：结缔组织适应不能依赖当下无痛判断安全，应以连续多天无症状为滞后指标，升量节奏比想象中还慢一档，把"探测"（低强度试跑）和"验证"（同强度多日稳定无症状）分开。

### 心率回落作为外周疲劳指标（HRV盲区）

7月初Adios 9连续跑量期实测：心率回落连续三天下滑（6/30=21→7/1=20→7/2=18bpm），同期夜间HRV却横盘稳定在81ms。这个反差揭示——心率回落（副交感再激活效率）能捕捉到HRV尚未反映的外周肌肉骨骼层面疲劳积累，而夜间HRV主要反映中枢ANS状态。当HRV表面稳定但心率回落逐日走低时，应判定疲劳正在外周层面积累，及时降量。启示：HRV不是唯一决策变量，心率回落趋势+局部组织信号（如足底反应）在结构性负荷判断上更灵敏。Polar H10晨起静息数据引入后，可进一步交叉验证中枢与外周疲劳的分离。

停训流失周期的实测验证（8月1-2日）：结论是 1-2 周停训对本人的力量素质与肌肉维度未造成有意义的实质影响，可作为后续减量期决策的经验参照。7/31 停练背部两周后首次尝试接近正常强度训练（硬拉新高、面拉40kg×5），次日与次次日 DOMS 均为 barely noticeable 级别且持续减轻，未出现异常延迟性酸痛或表现下降。与 detraining 文献方向一致——力量在多数研究中需 3-5 周才显现下降，肌肉横截面积多需 8 周左右。

### 光电 vs ECG 测量差异与心率回落双相机制

Polar H10（ECG）响应速度秒级，在冲刺、心率回落、突发变向躲避等心率变化率快的区间远超华为Watch 5（光电）；稳态跑且环境适宜时两者偏差不大。关键认知修正：两设备测的是同一条真实心率曲线，理论应趋同，所谓"谁偏高偏低"不是固定系统偏差，而取决于测量时曲线处于加速/减速/平台的哪个阶段——光电算法在变化率快的区间因平滑/外推产生滞后与欠冲（例：PAP激活后真实心率进入107-110bpm平台，光电因"下降惯性"外推显示为100bpm）。往后量化偏差须分场景记录（稳态/冲刺瞬间/回落瞬间/静息平台），而非找单一偏差值。

心率回落双相机制（神经调节 vs 体液调节）：运动后心率回落分两相。第一相（前30-60秒）迷走神经重新接管，快速、精确、短暂，属神经调节特点。回落至平台后不再继续下降，由循环中儿茶酚胺（肾上腺素/去甲肾上腺素，半衰期分钟级）的清除速度决定——即使神经已放松，残留激素仍刺激心脏β受体维持一个高于静息的平台，体现体液调节"弥散、持久、缓慢"的特点。Polar H10 因 ECG 零延迟，能准确捕捉这条"快降后进平台"的双相真实曲线。

恢复心率（HRR）的统计口径辨析（7月29日核实华为官方口径）：华为运动健康显示的"恢复心率／Dropped"不是"停表瞬间到1分钟"的降幅，也不是起止心率的简单相减，而是固定2分钟检测窗口内的平均每分钟降速，即（运动结束心率−2分钟后心率）/2，显示时向下取整。实例：7/29跑后161→124bpm，(161−124)/2=18.5，显示18bpm/min。关键含义：巅峰期的27-33bpm与半马的27bpm同样出自华为 Watch 5（Polar H10 为7/4才到手），与7/29的18bpm/min 属同一套2分钟窗口算法，不存在跨口径问题。读法：对照通行参考标准（第1分钟应降30-50次、其后每分钟降15-25次）时应看曲线形态而非单一均值——7/29曲线为前1分钟降约30bpm、后1分钟趋缓至124的典型健康双相形态。手动1分钟掐表值是另一套口径，7/30起单独起算，见本节"HRR口径变更"。

静态 HRV（RMSSD）的精度维度（7月18日新增）：以上讨论的是心率曲线的动态响应速度差异；另一个独立维度是静息 RMSSD 本身的计算精度。已发表验证研究显示，胸带（ECG原理，如 Polar H10）对比金标准心电图的 RMSSD 平均绝对百分比误差仅 2.16%，而智能手机/腕部 PPG 应用达 17.49%，且一致性区间更宽；另一项针对 WHOOP 腕戴设备的验证发现，腕部 PPG 测得的 HR/HRV 变异系数（10-11%）本身就大于其测量偏差，说明日常波动噪音相当可观。结论：华为 Watch 5 的整夜均值 HRV 因样本量大（整夜连续采样）适合捕捉长期趋势方向，但绝对数值精度明显低于 Polar H10 晨起单点 RMSSD——这是"华为看趋势、Polar+Elite 看当天锚点"两轨并行协议成立的底层精度依据，而非仅凭经验形成的权宜安排。

### HRV升高≠恢复更好：功能性过度训练的副交感异常偏高（7月13日新增）

HRV 并非越高越好。Le Meur et al. 2013（Med Sci Sports Exerc）对21名铁人三项运动员的对照实验显示，3周超负荷训练后运动员表现下降（最大递增负荷测试成绩 −9.0%），但静息副交感活动却进行性升高，这种"副交感神经过度活跃"是功能性过度训练（F-OR）的特征性信号，后续多项研究重复验证。机制推测：升高的静息副交感调节可能是身体限制运动时交感参与程度的代偿，伴随最大心率下降与运动表现能力降低。判别方法：HRV 单一数值不能孤立解读，须结合睡眠结构（深睡/REM是否正常）、静息心率是否同步下降、主观体感是否真实轻松，三者不一致时按保守处理。实测对比：7/12 夜间 HRV 100ms＋晨起 RMSSD 99.23ms 高度重合，但当晚深睡18%(Low)＋REM 8%(Low)＋觉醒3次＋主观疲惫，更符合 F-OR 模式；7/13 晨起 RMSSD 104.39ms 创新高，但睡眠结构本周最佳（深睡32%＋REM19%＋0觉醒）且有明确降温解释，更符合良性反弹。同样是"HRV创新高"，背景数据不同，结论方向相反。

第三、四个案例（7月26日、7月29日）：华为夜间 HRV 连续触顶（7/26=110ms、7/27=102ms、7/29=106ms），发生在感冒收尾期，而同夜其余指标全部落在个人正常区间内（睡眠HR 49bpm、SpO2 96%、呼吸14brpm、深睡31%、总时长7h13、觉醒1次），且无急性应激事件、LF/HF仅2.17，测量情境干净，不属污染样本。按本节框架不解读为"恢复得特别好"。文献参照：Schneider 等（Frontiers in Sports and Active Living, 2021）对一名精英耐力运动员完整病毒性上呼吸道感染周期的追踪显示，HRV 在感染期下降、随后回升至病前水平并连续数日维持偏高，作者建议以该"偏高期"作为可恢复训练的信号。该文为单一个案报告（n=1），病原体与个体条件均不同，仅作方向性参照，不作确证。

本轮夜间 HRV 偏高的多因归因（8月2日建立，8月8日合并，8月20日结案转为被动观察）。需要解释的现象：本轮并非全程高于区间。轨迹为起病当晚101ms→7/22跌至70ms（本轮谷值）→逐日爬升→7/26起在上限附近震荡→7/30-7/31回落进区间→8/1创历史新高117ms→8/4回落至78ms→8/5-8/8在94-101ms震荡。要解释的是"后半程反复触顶并二次抬升"，不是一个持续性的高位平台。已确认①：参考区间自身在滚动漂移（实测62-100→65-108），同一数值107ms在8/2标 Above、8/3标 Within。"Above/Below range"标签是在追一个移动靶，历史标签之间不可直接比较，属设备行为。已确认②：华为整夜均值与 Elite 晨起单点之间是稳定的正向偏移，不是一系列"背离事件"——7/29至8/7十天中华为九次高于 Elite，两条序列离散度差一倍（Elite 全程62.7-87.1ms、跨度24；华为78-117ms、跨度39）。8/4那次"收敛"是华为跌至谷底碰到了 Elite 一直所在的带，不是 Elite 升上去。证据不足、不再追：睡眠结构机械性推高整夜均值——方向成立但解释力不够，8/4与8/7是本档案最干净的一对配对样本（深睡156/155min、REM 63/58min、总时长7h38/7h25、觉醒均1次），夜间 HRV 却相差20ms，存在约20ms的未解释项；训练负荷下降致高位平台——与睡眠结构始终未能分离。两条并列维持待验证，不设分离动作，不为凑样本刻意安排训练。已排除：副交感型过度 reaching（训练量在降不在升，方向不符）；异位搏动人为抬高 RMSSD（Elite 信号质量 Good、多数日0伪迹、ECG级采样无异常）；感染后自主神经功能紊乱（体位性心悸、不成比例疲劳、运动不耐受三项均无）。

Elite Readiness 评分的一致性问题（8月6日）：结论是该评分作记录、不作决策依据，评分高低不改变对该指标的处理原则。8/6 当日 Elite 首次给出10/10并提示可加大训练强度。须以与8/1相同的标准对待——8/1该 App 给出4/10及"副交感异常升高、建议减量"，已判定其建立在被深慢呼吸污染的 LF/HF 之上而不予采信；10/10 出自同一套算法，核心仍是 Relative Balance 指针居中（LF/HF 1.20），而本节已确立"LF/HF 的交感-迷走平衡说已被否定、单日值不解读"。8/6 测量本身干净（0伪迹、LF/HF双峰分离清楚），但时域 RMSSD 76.96ms 仅落在65-104基线中段，并非记录级数值。该提示的证据强度远低于其呈现方式。

DOMS 强度不可作为训练质量指标（8月6日）：真正的指标是负荷、次数与容量密度，DOMS 强度与肌肥大/力量增长的相关性本就很弱，用其判断训练质量会产生误导。实测：8/6 晨起背部 DOMS 明显轻于7/31那次，主观产生"没练到位"的错觉，但客观数据相反——8/5背日引体辅助配重降至12kg（7/31最难档19kg）、面拉顶组40kg由5次增至8次、划船第二组加10kg，总容量持平而时长短12分钟。DOMS 减轻的机制是重复训练效应（repeated bout effect）：7/31为停练两周后首次，8/5为5天内第二次背日，肌肉已适应该刺激模式。

1分钟手动 HRR 应作归一化解读（8月6日）：绝对降幅受起始心率高低影响（起点越高回落空间越大），跨日比较时优先看占起始心率的百分比，绝对值仅在起始心率接近时才可直接比较。旧口径三条记录 7/30 161→125、8/4 154→118、8/6 166→125，归一化后为22.4%／23.4%／24.7%，三次仅差2.3个百分点，收敛程度远高于绝对值。方法论留存：异常值与已知口径缺陷同时出现时，先等一次干净复测再裁决，比当场在两种解读间硬选更省事。8/9的30.2%离群点即为一例——该次停表后延迟数秒才计时、窗口长于60秒，8/10的干净复测（22.8%）回到带内后，裁定为口径缺陷所致的测量误差，"恢复能力台阶式提升"的解读放弃。

### Elite HRV 大幅波动的判读：以静息心率是否同向为准（8月19日建立·8月29日补完）

判据：单日或连续数日的大幅波动是否作疲劳解读，取决于静息心率是否同向变动——同向判为真实信号，不同向按测量波动处理。8/17-8/19 三天 Elite RMSSD 单调下行（100.07→85.66→74.16），静息心率（由 Mean RR 换算）单调上升（46.7→49.3→52.9bpm），两条线同向且逐日推进。当时三个候选（8/17起始点本身为伪高／累积训练负荷／连续三日热量低于目标）对这条趋势的预测方向完全一致，按共线性判定不能分离其中任何一个。8/20 在热量仍低于目标、且当日叠加一节背日的情况下，Elite 回升至91.28、静息心率回落至49.4，三日下行序列终止；同期唯一明显改善的变量是睡眠（入睡由02:02提前至00:54、时长6h41增至7h28、深睡连续性由68回升至82）。睡眠因此为当前最佳解释，热量假设被削弱但不撤销（能量可得性的效应通常有滞后）。本节为被动观察，不设验证动作。8/24-8/29 一轮完整案例：8/24 晨起 109.12ms 为本档案历史最高（z=+2.68），读数干净（信号质量 good、0伪迹、睡眠正常、主客观一致），至今没有已知污染源可归因，归入"未解"而非"假"。8/25 跌至62.91（z=−3.21）且静息心率同向由46.2升至54.7bpm，按本判据作真实信号处理，归因为8/24历史最大负荷课（容量6587kg、硬拉PB）后24小时的急性应激。此后连续偏低（62.91／63.57／67.12）至8/29回升至84.42、静息心率同步回落至51.0——回升发生在睡眠条件更差的一夜，说明限制因素不在睡眠；8/28大重量腿日之后仍能回升，也排除了训练负荷持续压制。回溯归因指向同期腹泻失水/电解质流失与肛裂的持续躯体应激。该归因无法逆向证实，但与整个五天窗口的数据形态一致（HRV异常与腹泻/肛裂时间线高度重合，与训练负荷时间线不重合）。已降级：RMSSD > SDNN 的"异常排序"形态学判据（8/18建立、8/20降级为待考）。附录C的32个字段不含 SDNN，该判据从建立之日起就无法用历史数据检验；8/20 在睡眠与静息心率均正常时再度出现该排序，说明它未必指示异常状态。不新增 sdnn 字段，不再用于任何判断。

### 观察项的主动/被动分类：观察服务于人（8月20日确立）

至2026年8月20日，档案中同时挂着九项待验证或待补记事项，其中约半数需要本人改变行为或专门记忆（刻意跑匀速、课末掐表、补记动作顺序、为验证假设而调整进食量）。本人当前的主要矛盾是12月考研，训练的作用是维持状态以保障学习。档案维护由此暴露出一个方向性错误：制造挂账的速度超过了关闭挂账的速度，训练记录逐渐变成了一份数据采集工作。分类原则：①被动观察——设备本就自动采集的数据（配速、心率、功率、触地、步频、平衡、睡眠结构、晨起HRV、静息心率），记录的边际成本为零，一律照常录入；②主动配合——需要改变训练方式、额外操作或专门记忆的观察，默认不设立，除非本人主动要求。已设立的主动类观察若长期未推进，应主动关闭，且"该指标对当前核心目标无贡献"就是充分的关闭理由。体感与客观数据的定位：日常训练决策以体感为准即可；客观数据作为零成本的兜底，仅在与体感明显分离时提示。其余时候不解读、不提醒。本原则优先级高于档案中任何单项观察的推进需求。

### 颈后高位下拉的风险评估（8月14日新增·首次引入即须评估）

结论：以颈前下拉（standard lat pulldown）替代颈后高位下拉——文献上两者的背阔肌肌电激活无显著差异，而颈后版本的关节成本明显更高。握距略宽、拉至锁骨位、肘部沿身体平面下沉，目标肌群刺激等效，去掉极限外旋这一项风险。理由：该动作的风险不在负荷大小而在关节位置——完成位需要肩关节处于"外展90°＋最大外旋＋水平后伸"的复合极限位，此位置下盂肱关节前方稳定结构（前下盂肱韧带、肩胛下肌）张力最高，同时肱骨大结节与肩峰下间隙变窄，冈上肌腱与肩峰下滑囊的撞击风险上升；颈椎亦需前屈避让杠杆，对颈段有额外剪切。对本人另有两条特定关切：8/7球局后冈下肌（肩外旋肌）曾出现剧烈 DOMS 并持续6天，说明该肌群耐受度在停练两年后仍未恢复到位；"左侧信号线"记录的四条同侧观察尚未确证，上游稳定性存疑时引入极限位动作，时机不理想。本条不是禁令：8/14首次引入（33kg×8／26kg×8／33kg×8）三组无当场不适，说明当前活动度可以承受。若坚持保留颈后版本，须降至可控重量、绝不追求次数，出现肩前方弹响或酸胀时立即停止。

### 深蹲传力链：躯干刚度决定表现上限，非单纯下肢力量（8月21日新增）

结论：深蹲的表现上限由躯干刚度决定，不是单纯的下肢力量。8/21 深蹲 60kg×5（RIR 2-3）纳入能力锚点，估算 1RM 由约63kg升至约72kg（+14%）；既往同重量测试为60kg×1-2、动作严重变形、接近力竭，与本次的终止条件不同（技术失效 vs 主动保留储备）。机制：负重深蹲依赖腹内压把腹腔转化为刚性传力柱（belly breathing ＋ 腹内压提升），躯干刚度不足时力在传导链中段被"吸收"、脊柱承受非预期屈曲，是代偿失稳的根源；膝内扣与腿部发抖是髋膝被迫接管本应由核心完成的稳定任务后的次生表现。本人的主观描述与此高度吻合——既往从底部起身时"传到腹部时出现明显损耗"，8/21重测时为"腰椎下腹部自带一圈腰带"，动作全程稳定。归因排序：①核心/躯干刚度提升（主因，可解释多数增幅）；②停训后 CNS 疲劳源移除（贡献通常5-10%，不足以单独解释14%）；③力量本身衰退慢，跑步维持了下肢肌量与肌腱刚度。滑轨卷腹、健腹轮、动态死虫这类抗伸展/抗旋转的核心刚度训练与下肢主项表现存在直接因果关系，不是绕行训练；8/21同一节课完成髋外展68kg×14，臀中肌（膝轨迹控制）与核心刚度同时改善，是传力"更充分"体感的共同来源。风险提示：躯干刚度提升消除了此前"动作变形先于力竭发生"这一天然熔断机制——过去技术失效会先于危险负荷出现并迫使停止，现在负荷可能被真实压到脊柱与髋而没有早期预警。加重节奏建议每次2.5kg，不按主观储备速度推进，理由是神经适应领先于肌腱、韧带、骨的适应，当前正处于该时间差的高点。口径说明：8/28 核实健身 app 的"总重/杆"设置后发现，标准奥林匹克杠铃杆重20kg，此前记录长期少算了10kg。截至9月11日三项PB为：深蹲60kg×5（1RM估算63→72kg）、硬拉70kg×3（1RM估算68→75kg）、卧推50kg×6；其中8月28日口径修正时的卧推里程碑为8月26日50kg×3，历史值不回写。日常训练行的容量数值未逐条回溯修正——同口径内部比较的相对结论不受影响。8/28起新记录一律采用正确口径。

### 健腹轮引入即遇动作顺序问题：核心真实上限未被测出（8月19日新增）

结论：核心在健腹轮上的真实上限尚未被测出。8/19首次执行（跪姿，推出角度约60-70度，3组×6/7/6次）时，限制因素是右侧肩后束酸胀而非腹部力竭；8/21改正执行技术后，当日由3组19次增至4组31次（+63%），且当日核心预疲劳程度更高（深蹲、硬拉、髋外展均已完成）——核心更累却做得更多，瓶颈已从肩转移至核心。压力现集中于腹直肌与下腹、腰椎一带，与预期机制一致。技术要点：推出阶段躯干须跟随手臂前移，全程锁定肩角（视线与轮子平行）。只把手臂伸出而躯干不动，会让肩在末端屈曲位做等长承载，承担本该由核心完成的抗伸展工作——8/19的右肩酸胀即出于此，推出60-70度已属肩关节末端屈曲承载的深位区间，是肩袖与后束最易受损的位置。风险判据：推至最深位时若出现下背塌陷感或酸痛，视为核心圆柱失稳、行程过深，立即回退行程。次要监控保留三项：肩前侧或深处锐痛、外展弧中段疼痛、夜间侧卧压痛，出现任一项即撤下该动作。弥散性乏力的判据是时程而非强度——24-48小时消退属正常疲劳，超过72小时不退或伴随外旋无力，才按肩袖问题处理。

### RMSSD与SDNN比值：三段式认知修正（8月15日）

结论：RMSSD/SDNN 比值反映的是信号的自相关结构（变异集中在逐搏级高频震荡、还是含慢速漂移成分），不是"哪个自主神经分支更活跃"。本人的该比值基线未知，不作判断依据，仅作记录追踪。核实依据：Nunan et al. 2010 系统综述（21438名健康成人，经 Shaffer & Ginsberg 2017 收录）给出5分钟短时程常模为 SDNN 50(16)ms、RMSSD 42(15)ms——群体均值是 SDNN 高于 RMSSD。短时静息记录中 SDNN 的主要来源同样是副交感介导的 RSA；只有当 ULF/VLF/LF 等频段功率大于 HF 时才对 SDNN 贡献更大，而 LF 对 SDNN 有显著贡献是24小时记录的特征，不能套用到5分钟静息记录上。判读注意：只看差值而不看基线走向会选错参照系。8/13至8/15比值由0.98降至0.91，看似"倒挂加深"，但同期 RMSSD 与 SDNN 都在大幅上升（75.83→98.36、74.28→89.89），实际是 RMSSD 涨得比 SDNN 快，不是 SDNN 本身出问题。

### HRR口径变更：等峰值法 → 标准停表法（8月15日）

背景：手动1分钟 HRR 的前六点（7/30、8/4、8/6、8/9、8/10、8/13）经追问确认，计时起点均为"心率因惯性上冲至峰值的那一刻"，而非标准定义的"运动停止的那一刻"。该口径与文献常模（Cole 1999 一脉）不一致，此前得出的收敛带22.4-24.7%及8/9的30.2%离群点，均只在自身序列内部可比，不可与外部常模对照。8/15起改用标准口径：停止运动瞬间即计时，与停表动作同步完成（理想做法是同一手同时按停手表与计时）。

两套口径不可混用、不可换算比较（按第十节跨口径禁令处理）。7/30-8/15 六点冻结为"旧口径·等峰值法"独立序列，仅供历史参照；8/15之后为"新口径·标准停表法"独立序列，另行起算。采样条件：新口径只在收尾即停的课上采集。"从有氧稳态直接停表"与"从接近努力上限收尾停表"之间存在生理差异，归一化只消去起始心率的量纲，消不掉这个差异，故场景不符时不勉强补点，附录C的 hrr0/hrr1 留 null。手表给出的2分钟值按录入纪律②一律不入库，两条序列均不接收。

新口径现有四个样本：8/22 19.0%（当日气温29℃，热应激拖慢心率回落，不解读为恢复能力下降）、8/23 23.1%、8/27 23.5%、8/29 24.8%。四点落在同一窄带内，样本量仍不足以正式建立收敛带，但趋势已足够稳定，可作日常参考区间使用（约19-25%）。8/22与8/23构成一组几乎受控的对照：两日均心率仅差1bpm（135 vs 136）、爬升接近（63.7m vs 61.2m）、同为 React、路线相近，主要差异是气温——由此确认8/22那个偏低的降幅可归因于热应激，而非恢复能力下降。收敛带的验证路径已于8月20日关闭：不再为积累样本而刻意在课末安排冲刺收尾，也不再提醒掐表；顺手测了就照常记录，未测则留 null。口径定义与采样条件在记录时依然适用。

### 左侧信号线：四条同侧观察的归集（8月13日建立·观察项，未确证）

四条被动观察的共同点只有"都在左侧"这一项，故建为观察线而非结论：①8/9跑步左右平衡50.5/49.5，华为标注 Fair symmetry–Leaning left，为近期首次跌出 Good，且同日热身段仍为 Good、仅主课出现，8/10即恢复50.0/50.0；②8/12腿日深蹲热身左髌腱弹响，热开后消失，无痛；③8/13左股外侧肌单侧 DOMS，右侧无任何感觉——双侧动作后出现单侧 DOMS，通常意味着实际负荷分配不对称；④8/13有氧课冷启动 PAP 冲刺时左膝股外侧肌与髌骨连接处不适，后半程进入稳态后消失。四条的层级并不相同（步态指标／组织信号／训练量分配信号／髌股关节轨迹信号），不强行拼成一条因果链。但存在一个能同时覆盖它们的上游候选：左侧髋部稳定性（尤其臀中肌）偏弱→下蹲与跑步时膝盖轻微内扣→身体调用内收肌与股四头代偿控制轨迹→股外侧肌张力升高→髌骨轨迹外偏。该候选目前无直接证据，仅作待查。8/12弹响的48小时观察窗已走完且为阴性（膝盖骨下方按压、下楼梯、蹲下、久坐起身四项均无痛），弹响定性为良性、非病理，符合15周未做深蹲后复训初期的预期现象，不再单独观察——但该阴性只对"髌腱本身有无损伤"这一问题有效，不能据此撤销上游的稳定性假说。

首个功能性实证（8月24日）：硬拉冲 PB 至70kg时，左膝出现明显支撑不住、左大腿感受到"维持不住张力"，主动终止上举，无痛感，训练后及次日均无痛。与前四条的性质不同——那四条均为被动观察，本条是负荷下的功能表现，且高度可复现（触发条件明确：接近1RM的髋主导大重量）。硬拉是髋主导动作，膝关节本应仅承担稳定角色，其率先失守提示问题更可能在髋膝稳定链（臀中肌、股四头肌等长控制）而非拉力本身，与深蹲传力链中膝内扣的机制同源。处理：因无痛且为主动终止，判定为训练安排问题而非伤病，不需就医。硬拉暂缓冲击新 PB。新增单侧诊断工具——保加利亚分腿蹲，自重或轻负荷，双侧做到力竭记录次数差，每周一次，作为诊断工具而非训练量；左右差2次以内属正常，4次以上需专门处理该侧。若确认左侧偏弱，处理方式是把髋外展改为单侧做、左侧多做一组，改的是上游而非患处。

衍生的操作规则（8月13日）：DOMS 期不做冷启动 PAP 冲刺。8/13的触发组合为"腿日次日＋左股外侧肌单侧 DOMS＋冷启动冲刺"三项叠加——股外侧肌本就是把髌骨往外拉的主要肌肉，DOMS 状态下张力更高，冷启动又缺乏温度带来的组织顺应性，冲刺则瞬间放大负荷。要做冲刺则先跑10分钟热开再加速。

### 右肩问题：晨起旋前位疼痛，机制推断与训练调整（8月20-24日累积，8月24日整理）

症状：右肩外展20-30度位做前屈动作时疼痛，晨起最明显但一整天均有；前臂旋前（手心向下）位诱发、旋后（手心向上）位完全不痛；被动活动不痛、活动度主观评估正常；承重闭链位（平板支撑）亦可诱发，诱发后疼痛持续一段时间自行缓解。疼痛定位于肩前方深层。反复自测本身会激惹疼痛，自测频率已降至每周一次。机制推断（非诊断）：被动不痛＋活动度正常，倾向排除关节囊粘连类问题；旋后位不痛与肱二头肌长头腱病的典型方向相反，该假设已弱化；旋前位特异性疼痛（对应查体中 empty can/full can 测试原理）指向肩峰下间隙、冈上肌腱一类结构，机制上与肱骨内旋时大结节转至肩峰下有关。承重与非承重两种情境均可诱发，说明激惹条件比"特定角度的主动活动"更宽；疼痛自行缓解、非持续加重、非即刻锐痛不退，时程上符合肌腱/滑囊受激惹而非结构撕裂。背景线索：①8/7球局（3.5小时，停练两年后首次）后冈下肌（肩外旋肌）出现剧烈 DOMS 并持续6天，提示该肌群耐受度长期不足——外旋肌群的功能是上抬时将肱骨头下压稳定，能力不足会增加肱骨头上移、挤压肩峰下间隙的倾向；②8/17肩胸课前中束动作合计16组、后束（面拉）因器械故障0组，前后失衡可能放大该倾向。训练方向：面拉作为外旋肌群与后束的直接训练动作列为优先项；引体与高位下拉避开内旋位（改用中立或反手握，反手握二头肌参与更多、更接近正手发力模式）；跑步与下肢训练不受影响。当前限制项的具体解除情况以§2为准。已整理详细背景交接报告供其他医疗咨询渠道参考（2026-08-24），本节为该报告在档案中的存档摘要。建议完成专业查体确认。

### 体感与数据的一致性序列（8月13日归并·原分散于四条逐日）

操作规则：体感不是一个笼统的准或不准——一致时作确认、分离时以客观为准。出现不一致时，先判断属于哪一类：(a) 相对参照系差异（如天气红利未发挥）、(b) 真实输出变化、(c) 与生理负荷无关的即时因素（鞋、胃排空、睡眠惯性）。三类的处理完全不同：把 (a) 或 (c) 当成 (b) 会导致不必要的减量，反过来把 (b) 当成 (c) 会掩盖真实的恢复不足。判别的主要工具是同心率下的配速与功率是否同向变动：同向即 (b)；仅配速变而功率不变，多为坡度或参照系问题；两者皆无变化则应查 (c)。晨起主观状态只作记录，不单独进入当日训练强度决策，真正有裁决权的是§8既定的四级优先级。

八次记录的分类：①8/6 背离（体感差·数据好）——同心率下比8/4快5秒/km属效率改善，但按"阴雨降温段同努力约快1分钟/km"的既有修正，22°C小雨本应快得更多；体感捕捉到的是"相对于应有水平的欠缺"而非绝对退步，属 (a)，此时体感与数据都对，量的是两把不同的尺子。②8/8 一致向下——同心率慢13秒/km、触地持平、功率接近，是真实输出下降，主因前一日能量赤字，属 (b)。③8/9 一致向上——同心率快24秒/km且功率同步上升，为输出恢复，使②的归因闭环。④8/10 体感一般·数据无异常——均心率、负荷、恢复时间均为近期最低，客观面无疲劳证据，归因换鞋（React 体感拖沓）＋练前高脂延缓胃排空，属 (c)。⑤8/15 一致向上·本序列最强的一次——体感"像要飞起来"，同期睡眠8h24、评分90、Elite 98.36ms、睡眠HR 44bpm 四项客观数据同时最优，10.09km 跑出近期最低均心率134bpm。⑥8/16 分离·方向与⑤相反（体感差·数据最好）——全天持续"睡不醒"但认知功能正常、可正常学习，当日跑出7/26以来最低触地231ms、最高步频180spm；晨起惯性属认知唤醒度，与自主神经/心血管恢复是独立两套系统，属 (c)。⑦8/17 分离·主观优于客观——体感"还行"，客观为3h30睡眠、REM仅21分钟、全天打哈欠，当日未采信体感，判为清晨皮质醇上升叠加急性睡眠剥夺初期的交感代偿；本人提出的"像5/17比赛那天"类比不成立，5/17睡眠充足属真实状态良好，两者只是主观感受相似而生理基础相反。⑧8/18 一致向上——8h07、评分92、觉醒0次、呼吸质量100分、睡眠心率46、Elite 回落至常态带，主客观同向，此时体感具有信息量。

### 胸带勒感的候选归因（8月6日首现·8月10日收敛）

现象与结论：8/6起佩戴 Polar H10 时勒感明显增加，几日内调松近1cm仍觉紧，静息状态即勒，而戒指、袜口、晨起眼睑等其余部位均无变化。"只有这一圈紧"这一条同时削弱了全身性液体潴留类解释（糖原带水、钠负荷上升），最可能的是胸带弹性带自身老化收缩——H10 于7/4启用，一个多月的汗液与反复清洗正落在该窗口。次要候选是 DOMS 局部肿胀：8/7球局后背阔肌上部剧烈酸痛，而背阔肌正绕胸廓走行、直接压在胸带路径上。已排除肌酸（E-MASS 配料表无肌酸、无钠盐）与胶体渗透压方向（蛋白摄入升高理应使白蛋白略升、把水拉回血管内，预测与观察相反）。8/23胸带与爬升条件基本不变而症状消失，本条暂可放下。操作要点：当前松紧下信号质量仍为 Good、伪迹为0，说明松紧度早已够用。胸带过紧不提升信号质量，反而可能限制胸廓活动、改变呼吸模式而污染频域指标，与深慢呼吸污染属同类风险，不应为求信号而忍受勒感。

### 恢复时间算法的输入不止当日负荷（8月3日实测）

实测：8/3胸肩课负荷16、时长49分钟，恢复时间10h；7/31背日负荷26、时长长24分钟，恢复时间反而只有6h。负荷更低而恢复时间翻倍，说明手表算法纳入的是"进场时的恢复状态"（HRV、睡眠、既往负荷残余），而非仅当日训练量。8/3的实际背景是：8/2阈值课的20h恢复窗口尚未走完（要到8/3下午三点多才到期），且当晚睡眠仅5h30min——两项赤字被算法显性化为更长的恢复时间。

实操含义：恢复时间是一个复合读数，不能反推当日训练强度，也不能用来横比两堂课的难度；它的正确用法是回答"从现在起还需要多久"。同时这是"体感好≠恢复账目已结清"的一个客观印证——当日主观定位为轻松的动作打磨课、练完无疲劳感，算法给出的却是近期最长的恢复时间。

### 协同肌瓶颈与动作排序（8月5日提炼）

现象：背日中二头与三头先于背阔肌力竭，目标肌群刺激被协同肌的提前失败截断。

归因拆解：二头——引体主动肌为背阔肌、肱二头为协同肌，本次辅助配重下调（降至12kg，7/31最难档为19kg）使绝对负荷上升，二头作为该链条上截面积最小的一环故先到极限；当日垂直拉总计52次，累积容量本身偏高；热身那4个自重引体（60kg，难于当日任何工作组）有贡献但非主因（占比不足8%且组间100s恢复）。三头——引体为垂直拉，三头是伸肘肌，既非主动肌亦非主要协同肌（仅长头跨肩关节轻度参与），故其疲劳只能来自8/3胸肩日的残余，与本次热身无关。

排序规则：把最难动作放在热身位会形成"最难→较易→较难"的倒置强度曲线。正确做法是二选一——(a) 移至工作组之后作最大努力收尾，兼作纵向力量指标；(b) 前置但降至1-2个纯作神经激活，高强度低容量不引起疲劳，这才是 PAP 的正确用法。绕过瓶颈的补救：可在引体后补一组器械划船到力竭，避免背阔肌因协同肌失败而未练到位。

### 非训练负荷亦是负荷来源：日常活动与代偿性单侧化（8月8日新增）

实测依据：8/7打乒乓球约3.5小时（两年来首次，且对手为削球手，拉起下旋需大幅前臂内旋＋强烈向上摩擦），次日右侧持拍臂出现自上臂放射至肩胛骨的DOMS，并在肘、腕关节出现深层痛。初次归因仅指向球局时长，经用户补充两项后归因才完整：①备考期每日长时间写字——握笔是持续的低强度等长收缩叠加腕部小幅重复运动，前臂屈肌群与腕伸肌几乎全程紧张，该负荷单独存在时可耐受，但叠在已过载的链条上便不再有恢复窗口；②8/7左手拇指刀伤致几乎全部日常动作单侧化，右臂在非训练时间的基础负荷同步上升（此项为短期变量，左手愈合后自动消失）。判别支持：卸载（不写字、让手闲置）后痛感明显减轻，符合负荷相关的过度使用性疼痛；痛感为深层且说不清定点，指向关节囊／深层结构的累积负荷反应，而非肌腱附着点病（后者按压肱骨外上髁等点应可定点复现）。当日无发热，主观精力感反优于前一日，感染线索不成立。

机制定位：本条与§7"结缔组织适应vs肌肉适应"属同一族。两年未打球等同于该动作模式的耐受度已退至很低，一次性给到3.5小时是典型的负荷跳跃，与"停练14周后深蹲须从30-35kg起步"是同一条道理，区别只在于打球当时没有人替他计这笔账——训练有处方，娱乐没有。

实操启示：①本档案此前只记录训练负荷，本条为首个非训练负荷主导的案例——负荷来源应包括日常活动（写字、久坐用手）与代偿性单侧化，评估累积负荷时须一并计入，尤其在备考期这类日常负荷高度重复的阶段；②急性期不做拉伸至疼、按压揉搓或反复绕环，关节囊炎症期越动越明显，主要靠时间；③减负应作用在源头端而非患处：每写40-50分钟停5分钟让前臂完全放松、降低握笔力度、改用粗笔杆，比处理右臂更有效；④伤侧手在不需要精细捏握与用力的动作上应尽早回到日常分担，避免健侧长期独担；⑤观察窗口48小时，疼痛应逐日减轻；若三日后无变化，或出现关节肿胀、活动时卡顿弹响、晨僵超过30分钟，则超出过度使用范畴，须就医排查。⑥连带决策：背日及一切上肢力量课推迟至疼痛消失后（至少8/10之后）。

### 夜间多尿的候选机制与分离方案（8月11日新增）

现象：8月上旬起连续多日于05:00-06:00被尿意憋醒，尿量偏多，一度憋至排尿无力（后者提示膀胱过度充盈，逼尿肌被过度牵张后收缩力下降，属可逆但不应反复忍受——已确立"醒了就去，不躺着忍"）。

候选机制：①寒冷利尿（机制成立）——贵阳夜热致睡眠不盖下肢，后半夜降温使足部受冷，皮肤血管收缩→血液由外周回流核心→中心血容量上升→心房牵张感受器激活→抑制 ADH 并促 ANP 释放→尿量增加，与浸泡利尿同源。足部富含动静脉吻合（AVA）、是主要体温调节器官，血管收缩反应强于躯干皮肤，故"脚踝以下发冷即尿频"有生理基础；该假说另可解释两点既有观察：为何集中于日出前最低温时段、为何尿量偏多（ADH被抑制产生稀释尿）。②高蛋白渗透性利尿——尿素排泄须携水，蛋白由原水平升至136-150g，溶质负荷实增，可解释"液体量未变而夜尿出现"。③睡前液体时点（晚餐300ml＋睡前250ml集中于睡前3-4小时）。④钠负荷上升——近期以卤味与外食为主，钠远高于自制餐。四项目前未分离，按被动观察处理，不设专门的分离动作。配套观察指标（零成本、设备自动采集）：深睡连续性能否稳定在85以上、晨起睡眠惯性是否减轻。

### 频域指标在本人身上长期不可靠（8月11日固化）

实测依据：Elite 清醒静息测量的 LF peak 反复落在正常呼吸带（0.15-0.40Hz，对应9-24次/分）下缘或以下——8/4与8/8出现双峰重叠于0.15Hz分界、8/9为0.121/0.152Hz、8/10为0.094Hz、8/11为0.090Hz（约5.4次/分），而同期睡眠呼吸频率稳定在14-16brpm。清醒静息呼吸慢于睡眠呼吸在生理上属反常，合理推定为平躺5分钟测量过程中呼吸自然放缓，属稳定的个人测量特征而非偶发操作。须与8/1的污染样本区分：那次系刻意深慢呼吸，形态为 LF peak 0.059Hz 伴 SDNN 119.23ms／TP 8809ms² 同步虚高；8/11则 TP 3643、LF power 较前日降半，方向相反，不属失真。操作规则（固化，不再逐次判断）：本人的 Elite 频域指标（LF/HF、各频段 power、各峰频）一律不解读，只采信 RMSSD 与 Mean RR；仅当出现8/1那类"TP 与 SDNN 同步虚高"的形态时，才额外标注为污染样本并连 RMSSD 一并降级。

### 多信号交叉验证：区分表面矛盾（测量窗口效应）与真实疲劳信号（7月18日提炼）

两个对照案例揭示了同一个判断框架的两种结果。7/15：华为夜间HRV 67ms看似远低于晨起Elite RMSSD 88.11ms，但深睡/REM/呼吸质量/晨起心率全部正常——判定为整夜均值被入睡延迟(00:54)拖累的测量窗口效应，非真实疲劳，属于"单一读数异常，其余信号正常"的表面矛盾。7/18：华为夜间HRV 52ms跌破个人区间下限、觉醒次数2次(参考0-1，判定High)、LF/HF比值2.14（较前几日0.87、0.58明显升高）三项独立信号同向恶化，判定为真实疲劳信号（大概率源于7/17背日额外加练的递增硬拉组，中枢与下背部负荷被训练负荷算法低估），当日按弹性日"疲劳/DOMS明显"档执行快步走而非慢跑。操作规则：单一指标异常且其余信号正常时，优先排查测量窗口/协议差异等技术性解释，不轻易判定为真实疲劳；两个以上独立信号（夜间HRV、觉醒次数、LF/HF、深睡/REM结构、晨起心率等）同向变化时，判定为真实生理信号，按训练决策优先级（§13安全声明）降级处理。

### 晨起单点HRV偏低的机制与睡眠惯性（7月19日提炼·文献细节见附录B）

操作结论：晨起Elite单点RMSSD偏低、但华为整夜均值高位且睡眠结构／主观恢复正常时，优先判定为"测量时机落在睡眠→清醒过渡期"的技术性拖累，不判定为真实疲劳。两条独立机制支撑：①清晨睡→醒转换是全天交感激活转变幅度最大的时点，叠加昼夜节律因素（Boudreau 2012；Somers 1993）；②"睡不够感"是睡眠惯性即认知系统恢复滞后，与自主神经／心血管恢复是独立两套系统，起床活动20-30分钟自然消散，不影响训练决策（Tassi & Muzet 2000）。该判定有前提：须确认测量确实紧接觉醒。8/7的Elite 67.77经用户确认为按标准协议执行的干净数据，此机制即不适用，相应解释已作废，该低值转为观察项、不以另一个顺手的解释替换。三篇文献的完整核实要点与原作者自述局限见附录B。

### 晨起测量的污染源：急性应激唤醒 ≠ 普通睡眠惯性（7月20日提炼）

实测依据：7/20被电话叫醒处理要紧事，在主观"迷糊感消退后"才做晨起Elite测试，结果LF/HF飙至4.54（远超近期0.58-2.14区间）、RMSSD 55.15ms（近半月最低），华为侧同步显示轻睡68%(High)、觉醒2次(High)、评分80偏低。机制解释：被电话叫醒+处理要事是一次急性应激唤醒（触发肾上腺素/皮质醇），与"闹钟/自然醒后的普通睡眠惯性"是不同类别的生理事件；应激唤起的消退速度与睡眠惯性不同步，因此"等惯性消失再测"并不能得到干净基线，反而把一个更强的应激变量混了进去。实操启示：①晨起测量若前置了电话叫醒、争执、噩梦惊醒等急性应激事件，该次读数标注为"应激污染样本"，不作恢复状态解读，尤其不用来给前一日训练负荷做鉴定；②"主观迷糊感消失"不能作为"可以准确测量/身体已恢复"的判据——睡眠惯性属认知系统，与自主神经/心血管恢复是独立两套系统（承接上一小节结论）；③真实的恢复基线需等一次无突发应激的自然醒晨测。此条与"多信号交叉验证"规则配合使用：污染样本往往表现为多个交感相关指标（LF/HF、RMSSD、觉醒次数）同向异常，但这里的"异常"归因于测量情境的应激，而非训练疲劳，两者靠"当日是否发生急性唤醒事件"来区分。

第②类·光照致混乱式急性唤醒（8月2日）：环境漏光在日出时段将人唤醒，若伴随"以为已经睡过头/天已大亮"的短暂认知混乱，即便持续时间不长（本次28分钟），仍带有轻度肾上腺素成分，与电话/噩梦等经典急性唤醒同属一类，区别只在强度更轻。若测量紧邻唤醒事件、或当晚因此类事件导致觉醒次数/轻睡比例同步升高，则当晚夜间 HRV 均值判定为污染样本，不纳入趋势。第③类·热水澡致交感激活（8月16日）：热水浴使皮肤血管扩张、心输出量向体表重新分配，交感张力代偿性升高，该状态下的 RMSSD 不反映恢复水平。8/16晨起先排尿、后洗热水澡，5分钟内完成 Elite 测量，RMSSD 57.09ms，不仅跌破常态带下沿70.2ms，且低于±1.5SD离群线66.1ms。这一类有一个其余污染源都没有的自检手段：正常状态下坐姿与平躺的 RMSSD 应有明显差异（平躺更高，属体位反射），8/16两者数值相同，趋同本身即提示交感张力异常偏高。该判据不依赖与历史值比较，可当场判断，比"数值偏低"更可靠——数值偏低有多种成因，体位反射被压制只有交感张力一种解释。正反双例（8月18日补齐）：8/16为反例，先洗澡后测量得57.09ms；8/18为正例，同样洗了热水澡但测量在洗澡之前完成，得85.66ms，落在常态带中上部，读数干净。两日的差别只在操作顺序，不在是否洗澡——反例证明违反会污染，正例证明遵守即可规避、无需为此取消洗澡。晨起 Elite 的测量前置条件因此为三条：开灯之前、洗澡之前、不紧邻急性唤醒事件。判别缓冲：若该次测量距唤醒事件已有数小时，扰动通常已消退，可正常采信。按录入纪律④，污染样本照常进入附录C与基线计算，是否剔除在使用时判断。

### 睡眠与运动员：BMJ 2021专家共识（7月26日核实·完整要点见附录B）

来源：Walsh NP, Halson SL, Sargent C, et al. Br J Sports Med 2021;55:356-368。与本档案直接相关的可执行结论：①消费级腕戴设备不能准确测量睡眠分期，且系统性高估总睡眠时间与效率、低估觉醒次数——故华为的睡眠分期百分比参考价值低于其 HRV 趋势，支持"华为看趋势、Polar+Elite 看当天锚点"的两轨协议；②按 PSG 常模，本人深睡长期20-35%显著高于16%常模（利好），浅睡61%属典型值无需焦虑，REM 才是当前偏离常模最明显的一项；③午睡协议：≤30分钟、窗口13:00-16:00，若存在夜间入睡困难则应完全避免午睡；④Banking sleep：考前1-2周主动拉长睡眠，比考前一晚临时要求自己睡好更可靠；⑤忽略华为的"睡眠评分"与自动标红提示，只看档案自定义指标。该共识对象为精英运动员，且原文自述该领域证据质量总体偏差、明确反对"一刀切"——完整的十条要点、各条原文局限与 Orthosomnia 适用性评估见附录B。

⑩ 该共识的整体局限（原文自述）：研究对象为精英运动员，与本人（认真的业余训练者+备考学生）在训练负荷、跨时区旅行、赛前焦虑等方面差异显著，相关结论需打折；论文结论段明确指出该领域现有证据质量总体偏差，主因研究方法不一致、不可靠、缺乏有效性验证，其对同行的核心建议之一即为改进研究方法，故文中具体效应量数字均需保守看待；论文摘要明确反对"一刀切"，指出7-9小时统一建议对运动员未必最优，推荐个体化方案并应考虑运动员自己感知到的睡眠需求——此条支持本档案一贯的"用个人基线而非人群参考值判断"的方法论；另有一未解问题与本档案§7已有内容相关：睡眠延长是否会加重睡眠惯性并损害醒后表现，目前尚无定论，与Tassi & Muzet 2000关于睡眠惯性昼夜节律"尚无直接证据"的表述可互相印证——该领域至今存在争议。

### HRV的自主神经与情绪调节理论基础（7月21日五篇文献核实·完整内容见附录B）

定位（避免张冠李戴）：这五篇属于"HRV 作为自主神经／情绪调节指标"体系，回答的是"设备测的这个数本质是什么"，不是"该怎么练"；训练量决策仍属另一支文献（Buchheit／Plews／Le Meur 一脉），两个体系不可混用。四条落地要点：①前额叶抑制回路（Thayer 神经内脏整合模型）解释了心理应激何以能完全独立于肌肉疲劳压低 HRV（6/27母亲手术32ms、7/20电话应激）；②PPG 测的是脉搏间期＝心搏间期＋脉搏传导时间，应激会改变动脉弹性从而污染读数，故 PPG 静息可用、应激／冲刺状态不可靠，这是两设备偏离的第二重机制；③LF/HF 的"交感-迷走平衡"说已被否定，本档案"只看长期趋势、不解读单日值"的立场获权威背书；④静息自然呼吸下不对 HRV 做常规呼吸校正，但须监测呼吸落在9-24次/分内——8/1晨测因刻意深慢呼吸致 LF peak 降至0.059Hz（约3.5次/分），SDNN／TP／LF 同步虚高失真，当日频域指标整体不采信、只用 RMSSD，此规则此后在8/4、8/8的双峰重叠案例上重复适用。五篇的完整机制叙述、Porges 多迷走理论争议等关键局限见附录B。

##   8    偏头痛管理

反复头痛伴可逆视觉异常需由医生评估是否为偏头痛伴先兆。视觉先兆可有闪光、雪花样干扰或局部视野变化，常持续5–60分钟后完全恢复，可伴或不伴头痛。视觉皮层传播性神经电活动变化是主要机制解释之一，不是已证实的机械性神经受压。HRV不能诊断偏头痛、判断脑血管收缩或扩张，也不能排除急性眼科或神经系统问题。

历史症状保留：4月18日头痛7–8/10，同期HRV从100降至70ms、01:45入睡；用户报告布洛芬效果有限、冷水冲洗颈后及头部后自觉减轻约70%。这些是同日观察与主观疗效，不能确认血管扩张型病因或证明HRV因果，不据此规定冷水冲头治疗。

既往记录有起跑前2–3km头痛、随后自行消退；其病因未获医学确认，不能解释为已证实的脑血流过渡紊乱，也不能据此要求带痛继续跑。出现头痛伴视觉症状时停止运动；反复发作应至神经内科／头痛门诊评估，真正单眼症状还需眼科排查。

安全处置以症状为准，不设“HRV从80升至90ms”等医学预警阈值。9月29日晚仍6–7/10且反复加重，已建议当晚就医；9月30日确认未就医，视野正常、晨起头痛减轻约80%，上午冷水冲澡后进一步缓解，晚间跑后未加重但易累；10月1日晨起确认头痛消失、精力充沛，当天完全休息；未建立正式诊断。10月2日用户要求该事件翻篇，关闭主动追问及日常训练分析中的反复带入；历史症状记录保留。详见§6当日记录。突发最剧烈头痛、视力下降或持续视野缺损、无力、言语异常、意识改变、发热伴颈僵，立即急诊；不要自行驾驶。安静避光休息和正常补水不能替代所需评估。资料：NHS《Migraine》；American Migraine Foundation《Understanding Migraine With Aura》（2026-09-29核对）。

##   9    恢复、补给与营养策略

### 运动中补给

三通道模型：肌糖原/血糖/电解质同时维持。比赛日能量胶×3（第7-8km、第13-14km、第18-19km），每颗配水服用。节奏跑首选低渗电解质粉。红豆馅面包在节奏跑中引发过肠胃应激，避免。

### 营养禁忌（已实测验证）

| 禁忌项 | 规则 | 实测依据／机制 |
|---|---|---|
| 酒精 | 完全规避 | 300ml 啤酒致深睡 16% → HRV 跌 3ms |
| 咖啡因 | 14:00 后禁 | 绿茶 ＋ 白巧致 HRV 跌至 56ms |

### 大容量训练后恢复协议

0-30分钟：葡萄糖+香蕉。30-60分钟：冷热水交替冲下肢（血管泵效应）。睡前蛋白质优选酪蛋白（牛奶固体蛋白），消化慢覆盖夜间修复。

### 每日膳食计划（8月2日制订·v1.0）

制订背景：8月2日核查发现，当时实际每日蛋白质摄入估算仅45-50g，约为目标的45%，与§1"外胚型、热量盈余困难、肌肉量增长需要持续大热量摄入"的核心策略直接冲突。缺口本身远比"跑后蛋白粉舀半勺还是一勺"这个配比问题重要。本计划为解决该缺口而制订，适用于考研备考期（力量维持计划＋有氧为主＋每周一次阈值课）。

■ 每日目标量（2026-08-31 修订；按约 60kg 估算，体重基准未定，见§1）

| 营养素 | 目标 | 依据 |
|---|---|---|
| 蛋白质 | 100-115 g | 耐力＋力量混合训练需求区间。8 月 26 个记录日实测均值 121g，已在区间上沿之上，不再上调 |
| 碳水 | 休息日约 300 g／单课日约 425 g／双课日约 460 g | 由当日总热量减去蛋白与脂肪后倒推，不再单独设固定区间 |
| 脂肪 | 约 85／90／100 g | 占总热量 27-30%。由原 65-80 g 上调：原值与总热量目标不相容 |
| 总热量 | 休息日约 2400／单课日约 2950／双课日约 3200 kcal | 维持至微盈余。过渡值，由晨起体重滚动均值裁决，见表下修订说明 |
| 餐次 | 3 顿正餐 ＋ 1 个固定加餐模块 | 原依据「单餐吸收上限」作废：分餐对肌蛋白合成有边际价值，但不存在把蛋白截断在某个克数以外的吸收天花板。现行依据是执行成本——次数越少越不与自习时间冲突 |

2026-08-31 修订说明。原目标集在算术上不相容：蛋白 100-115g、碳水 330-390g、脂肪 65-80g，全取上限为 115×4＋390×4＋80×9＝2740kcal，全取下限为 2305kcal，整个区间够不到原定的 2900-3100kcal。也就是说，严格按宏量目标执行的人永远达不到热量目标，这不是执行偏差，是目标本身从制订日起就无法同时成立。记录端在 8 月 2 日制订时未做加总校验，已记入§7判断修订史。修订后三个日型的宏量与总热量互相自洽。

上表的绝对值是过渡值，不是已确证的需要量。维持热量从未实测，体重基准也未定（见§1），所有 g/kg 折算都建立在「约60kg」这个带 ±3% 不确定度的分母上，由它支撑的结论不能用确定语气。裁决办法是晨起体重的 7 日滚动均值：目标为每周增加 0.10-0.20kg；连续两周不涨，每日加 150kcal；连续两周每周涨幅超过 0.30kg 或腰围明显增加，每日减 100-150kcal。执行这条需要每日晨起体重的连续序列，而 训练数据集.json 的 32 个字段中没有体重字段，读数目前只散落在本档案的叙述里，共六个点。是否新增 bw 字段待用户决定：晨起流程本就含称重，该数据属零成本的被动观察，加字段能让热量目标由实测裁决而非继续估算。

执行上的主要缺口不在吃什么，而在白天的进食次数落在最容易被自习打断的时段。8 月 26 个有热量记录日的均值为 2705kcal，其中 19 天低于 2900；纯有氧日均值 2817、纯力量日 2736、8/31 力量＋有氧双课日只有 2525。改法是把加餐固定为一个不以饿不饿为触发条件的模块：每日 15:30 前后一次约 300-350kcal，在「250ml 全脂奶＋25g 坚果」「两片吐司＋25g 花生酱」「250ml 全脂奶＋50g 即食燕麦」中任选一种，前一晚装包。2026-09-03 材料到手，改用实拍标签口径：混合坚果 686kcal/100g（蛋白 18.2g、脂肪 64.8g、碳水 7.9g、糖 5.4g、钠 0，配料仅五种果仁、无添加糖油盐），25g 份 = 172kcal，较此前按通用值估的 150kcal 高 15%；Skippy 柔滑花生酱 611kcal/100g（蛋白 25.2g、脂肪 48.9g、碳水 16.0g、纤维 6.1g、钠 492mg），25g 份 = 153kcal、蛋白 6.3g、钠 123mg。花生酱配料表为花生、白砂糖、花生油、氢化植物油、食用盐——按含量降序白砂糖居第二，非无添加纯花生酱；标签反式脂肪标 0g，但国标允许每份 ≤0.3g 时标 0，"标 0"不等于零，标签本身无法回答此项，不作结论。两个可用配置的实算值：250ml 全脂奶＋25g 坚果 ≈ 332kcal；两片吐司＋25g 花生酱 ≈ 303kcal，均落在 300–350 区间。模块执行自 2026-09-04 起算。训练日在此基础上追加约 200kcal（香蕉＋花生酱，或晚餐加约 200g 熟米饭）；双课日再追加约 300kcal（午晚餐各加约 100g 米饭）。练后补给维持现行剂量不变，不再加粉或加乳清——缺的是总热量，不是蛋白。含糖饮料不作为增肌热量来源，其与晚间睡眠问题的重合见§6与§10。日型 A／B 中原有的上午加餐维持为可选项，本模块为固定项。

2026-09-01 立固定估算口径——8 寸（直径约 20cm）披萨整张：芝士型约 850-900kcal、蛋白约 38g；含少量肉类型约 900-950kcal、蛋白约 42g。依据为该直径常见薄底商品披萨成分表的区间，误差约 ±10%，无标签时按中值取用。9/1 当日两整张按 1800kcal／80g 计入。8/16 记录中"披萨为无标签估算"未定值，自本日起统一，不再逐次重估。

■ 日型B：力量日（上午训练）——与日型A的差异：①训练前：早餐提前至练前90分钟，或练前30分钟补香蕉＋葡萄糖水；②练后补给恢复§9完整配方（E-MASS 1.5勺），力量训练MPS需求显著高于跑步；③晚餐蛋白质仍需35-40g，不因上午已补过而减量；④睡前牛奶250ml在力量日为固定项而非可选。说明：原有"力量日晚上冲牛奶＋葡萄糖粉"习惯方向正确，建议扩展到每天执行，而不只是力量日。

■ 日型C：完全休息日——蛋白质目标不下调（维持100g+，肌肉修复在休息日进行）；碳水可下调至250-300g；取消训练前后补给，改为上午加餐＋下午加餐各一次，下午加餐建议酸奶1杯＋坚果一把（约P10g）。

■ 应急方案：无法坐下吃正餐时（8月8日并入，依据8/7执行偏离）——硬性前提：不得以E-MASS等训练补给粉充当正餐。该品碳水蛋白比约3:1，0.5勺仅得约15g蛋白却带入约50g碳水，蛋白效率低、碳水冗余，它是补给不是餐。8/7当日早、晚两餐均因赶时间以蛋白粉顶替，全天跌至约69-71g蛋白／1600-1800kcal，为计划执行以来首次未达标，缺口即全部来自这一模式。

可行替代（均无需坐下，图书馆与路途场景可用）：即食鸡胸肉——8月13日实购规格为35g装，每包仅约10.9g蛋白／50kcal／钠69mg（营养表按每100g标示：蛋白31.1g、脂肪1.5g、碳水1.0g、钠198mg，须按净含量换算，原记"一块约20g蛋白"系按100g规格估算，作废）；卤蛋两个约12g（可前一晚预置或便利店现买）；纯牛奶500ml约16g。据此修正配比：两包鸡胸(21.8g)＋500ml牛奶(16g)≈38g，方顶得上一顿正餐；单包只能算半个替代项。钠优势成立且不受规格影响：两包138mg，远低于两个卤蛋的600-800mg，亦远低于卤鸡腿套餐(整份逾1500mg)与拉面汤底(逾2000mg)。热量极低是使用限制：两包仅约100kcal，宜作加法补缺口，不宜替代主餐，否则热量会塌；若用于替代须同时补碳水。采购提示：藤椒味钠为198mg/100g，黑椒、奥尔良等口味通常显著更高，购前看营养表。若当餐同时需要供能（如后续有训练或长时间自习），须另配一份碳水——面包80-100g或香蕉一根，不要只补蛋白，这与§9既有"空腹有氧超30min须进食"及跑前方案一致。

个人固定规则（8月11日确立）：蛋白粉一律以牛奶冲调，不用水冲。用户汇报时若只写"X勺"，即按标准配方（300ml牛奶）计入，不再逐次追问。该规则源于一次计算口径不一致：8/7按标准配方计、8/10却按无奶计，致当日蛋白被低估至93g并误判为跌破下限，实为约106g、落在区间内。练前补给须为低脂快碳（面包或香蕉）：8/10练前食用120g沙拉酱面包（约450-500kcal且脂肪占大头），高脂显著延缓胃排空、消化道分流血流，为当日"体感一般"的第二因素（第一为React鞋体感拖沓）。力量日练前补给条款（8月15日补立）：§9原只规定"空腹有氧超30分钟须进食"，力量日无明确条款。8/14实测暴露该缺口——练前仅两根香蕉（210kcal、蛋白2.6g）即执行72分钟、容量3649kg的背日课，练后补给又在训练结束后才进，整个上午处于能量赤字，为当日下午乏力的第三项成因。规定：力量日练前应有碳水＋蛋白，而非纯快碳。可行组合为香蕉1-2根＋即食鸡胸两包（约21.8g蛋白）或＋卤蛋2个（约12g）；训练超过60分钟时尤其必要。该条与有氧的练前方案不可互相套用：有氧只需快碳供能，力量训练还需要氨基酸池。配套原则：应急方案是保底不是常态，连续两日以上启用即说明日程结构本身需要调整（如前一晚预置、整箱备货、把加餐装包），而非继续依赖临时替代。

■ 采购清单：必备（解决蛋白缺口）——牛奶每日1-1.05L建议整箱买、鸡蛋每日2-4个、无糖豆浆粉或即饮豆浆、原味酸奶、即食鸡胸肉（自习室与路途便携；8月8日由"可选增强"升为必备，为上文应急方案的第一顺位替代项。8月13日到货实测：35g装每包约10.9g蛋白、钠69mg，配料仅鸡胸肉、水、藤椒碎、食用盐，无磷酸盐／卡拉胶／大豆分离蛋白等保水增重添加剂。采购建议：每日用量2-3包时，35g装单位成本偏高，可改购100g装或整鸡胸）；已有继续——E-MASS增肌粉、谷氨酰胺粉、葡萄糖粉、即食燕麦、南瓜子；可选增强——无糖坚果。

■ 验证指标（4-6周后回看）：①体重应稳定或缓慢上升（§12中期目标63-65kg，但考研期以维持为主不强求增重）；②训练后主观恢复——DOMS消退速度、次日晨起体感；③HRV趋势——营养缺口修复后理论上有助于自主神经稳定性（观察项，非因果结论）；④力量表现——维持计划中的重量能否维持或小幅上升。

■ 估算说明：本计划的蛋白质/热量数字为基于常见食物成分表的估算值，非精确计量；个体差异、食材实际重量、烹饪方式均会造成偏差。执行标准以"是否达到餐次结构和主要食物量"为准，不必逐克称量。如需精确追踪，可用MyFitnessPal/薄荷健康记录1-2周，校准后凭经验执行。本计划不覆盖§9既有营养禁忌，酒精完全规避、咖啡因14:00后禁、高脂食物睡前3h禁、空腹有氧超30min须进食、节奏跑中避免红豆馅面包等条款继续有效。

■ E-MASS 增肌粉规格实测（8月2日照标签核查，Foyes／赴野士，GB 24154）：每100g含蛋白质23.0g、碳水化合物68.1g、脂肪1.8g、能量1615kJ、钠69mg，另含维生素B1/B6/C、烟酸、镁118mg、钙334mg、锌3.78mg、牛磺酸0.04g。标签自洽性校验通过（23×4＋68.1×4＋1.8×9≈380.6kcal≈1592kJ，与标称1615kJ在舍入误差内）。一勺=60ml≈45g。

由此得出的三条使用要点：①本品碳水:蛋白约3:1，是名副其实的"增肌粉"而非蛋白粉，任何按纯乳清粉（70-80%蛋白）估算其蛋白贡献的做法都会高估约3倍，历史估算已据此修正；②力量日1.5勺=67.5g粉→蛋白15.5g，加牛奶10g、燕麦4g合计约30g，碳水约104g、总热量约620kcal，落在力量训练后MPS最大化所需的20-25g蛋白区间之上，方案无需调整；③粉内已含四档碳水（葡萄糖→低聚麦芽糖→酶解燕麦粉→异麦芽酮糖，最后一档为低GI≈32的慢释碳水），外加葡萄糖粉与即食燕麦属重复叠加，但该重复有其功能——减勺数会同时减掉碳水，外加快慢碳水正好实现"降蛋白而保碳水"的解耦，故保留；若求简可改为"半勺＋只加葡萄糖粉"。

其他标签相关观察：脂肪仅1.8%属精瘦型配方，不触发§9"睡前3h禁高脂"；不含咖啡因（牛磺酸非咖啡因），故不受§9"咖啡因14:00后禁"限制，晚间力量课后可用；钠仅69mg/100g，几乎无电解质补充功能，夏季大汗后不可依赖本品补电解质；配料中"小麦肽"为不完全蛋白（赖氨酸偏低）但排序靠后、占比小，不影响整体蛋白质量评估；谷氨酰胺粉1.5汤匙（约10g）在成分检测上会计入蛋白质，但作为单一非必需氨基酸对MPS贡献极小，不应计入每日蛋白目标（与§9原有"对肌肉恢复的额外益处证据较弱"一致）。补给剂量的默认取值规则（8月16日补立，与8月11日"蛋白粉一律以牛奶冲调"同类）：用户汇报"标准补给""标准增肌粉补给"而未写勺数时，按当日日型直接取默认值——跑步日0.5勺（日型A已注明"维持现行减量方案不改"），力量日1.5勺（§9完整配方），不再逐次追问。该规则源于8/16的一次多余追问：当日已明示为跑步日，日型A对剂量早有规定，仍去问勺数，属未查档案而非信息不足，成本由用户承担。数值不一致修正（8月18日）：本节应急方案原写"0.5勺仅得约15g蛋白却带入约50g碳水"，与日型A中按实测标签的算法（一勺60ml≈45g、粉体蛋白23%；0.5勺=粉5.2g＋牛奶10g＋燕麦4g≈19g）不符——粉体本身在0.5勺下只提供约5.2g蛋白，15g是整杯（含牛奶底液与燕麦）的数字。这一错位会让"以蛋白粉顶替正餐"看起来没那么差：按正确口径，脱离牛奶底液单喝0.5勺粉，实得蛋白约5g而非15g，应急方案的硬性前提（不得以补给粉充当正餐）因此比原文所述更有必要。据此换算，力量日完整配方1.5勺≈粉15.5g＋牛奶10g＋燕麦4g≈30g蛋白、碳水约103g。睡前牛奶的规则冲突处理（8月17日实例）：日型B规定力量日睡前牛奶250ml为固定项，但当日前夜正因夜尿早醒且全天以"睡回去"为最高优先级，睡前250ml液体与该目标直接冲突，故主动偏离、未补。记为"依睡眠优先原则主动偏离"，不计入执行偏差。通则：日型条款之间发生冲突时，以当日最高优先级目标裁决，并在记录中写明依据，不默认按条款字面执行，也不事后补记为疏漏。外卖食品的重量口径（8月18日补）：外卖标注重量一般为成品重且常含酱料，同一份意面在"干重/熟重/含酱"三种口径下热量可差近一倍。处理办法：首次点某店某品时确定一次口径并记入档案，此后同店沿用，不逐次重估；口径未定前按熟重推断并标注不确定度。

### 考研后专项转型结构（5km/10km主攻·极化训练框架）

方向：考研后转5km/10km专项，与5km 15:00终极目标同一条线。关键认知纠正——5km/10km的限制因子是VO2Max、乳酸阈值利用率、跑步经济性，不是无氧糖酵解容量（后者服务800-1500m）。因此不是"减有氧、加间歇"这么简单，而是结构问题。

极化训练原则（Seiler）：约80%低强度有氧+20%高强度，中间强度占比最小。有氧基础不是被间歇替代的填充物，而是决定能吸收多少高强度刺激的"容器"——基础量削减会同步拉低间歇质量与恢复能力，不是此消彼长。故有氧总量维持甚至略增。

目标结构：有氧基础（现LSD+React体系）维持总量作底盘 → 在其上分化三块：①乳酸阈值跑（提升阈值配速，如4:13-4:17/km可持续吃力强度）②真正的VO2max间歇（贴近vVO2max配速3:20-3:40/km、恢复更完整；区别于现在7×1000m@3:30/km这种阈值/VO2max边界课）③少量strides/坡道冲刺（提升神经肌肉效率与跑步经济性，几乎零糖酵解代价、恢复负债低，与有氧体系兼容性最好）。力量训练目标函数从增肌导向转为爆发力+弹性储能导向（呼应肌肉量与经济性拮抗认知）。频次提升须跟随足底/跟腱恢复信号，非简单排课加量。

##   13    训练安全声明

⚠ 安全声明　所有训练均在运动生理学原理基础上进行，通过HRV、睡眠、心率多维指标监控。生理指标与计划冲突时，优先避免伤病和ANS过度负荷。持续疼痛或功能受限时立即停止。

生病期间训练/恢复判断框架（7月23日提炼）：采用运动医学"颈部以上/以下"经验法则——症状局限颈部以上（鼻塞、打喷嚏、单纯咽喉不适、无发热无全身症状）可考虑低强度训练；症状涉及颈部以下（咳嗽、有痰、胸闷、发热、全身酸痛乏力）应完全停止，带病训练有极小概率诱发病毒性心肌炎等风险，且可能延长病程。恢复训练前自查清单：连续24小时无发热；咳嗽/咳痰基本消失（非"减轻"而是"没有"）；晨起（非靠体位/日间皮质醇撑住）症状基本消失；食欲完全恢复；以上全部满足后再等48小时缓冲期。首次恢复从极低强度（Zone 1下限、20-30分钟）开始，观察当天及次日反应，无异常再逐步回归正常课表。

### 判断修订史（记录端自查·8月31日归集）

本节记录记录端在分析过程中出现并已更正的判断错误。此前这些留痕分散在各逐日行内，随 §6 改为周志后集中于此。保留的目的不是追责，而是每条各自暴露了一类可复现的推理缺陷。数据本身的口径修正不在此处，归入 训练数据集.json 的 _calibration_notes。

倒果为因（8月25日）：用 8/25 的低值回头把 8/24 的 109.12ms 定性为"大负荷前夜的迷走饱和假象"。该定性不成立——109.12 测于 8/24 晨起，大负荷课发生在当日 18:40 之后，一个读数不可能反映尚未发生的训练。修正后：两个读数都真实，中间隔着一节课，不构成矛盾。

违规复用已降级的判据（8月25日）：论证 8/24 为伪高时援引"RMSSD>SDNN 即异常排序"，但该判据已于 8/20 由记录端自己降级为待考、不作判断依据（理由：SDNN 不在数据集字段内，无历史基线，无法确定基础发生率）。对不利数据启用、对其他情况不提，属双重标准。

时间线凭印象推断（8月25日，两次）：其一把尚未开始的休息日当作已发生，据此推断"症状对休息不响应"；其二把练后 22 小时说成 72 小时观察窗已走完并宣布结案。已立规则：涉及"过了多久/窗口是否走完"的判断，一律从记录的起始时间点实算并写出算得的数值。

误用手表自动值（8月27日）：将手表 2 分钟 HRR（162→114）当作手动 1 分钟值解读，据此判断为当日唯一负向信号，违反录入纪律②。实际手动值 162→124（23.5%），与前一次持平，不构成异常。

归因过早收敛（8月19-21日）：健腹轮首次执行时肩后束先于核心力竭，记录端归因为动作顺序造成的后束预疲劳；用户随后发现真正原因是执行技术（推出阶段只伸手臂、躯干未跟随，肩在末端屈曲位等长承载）。教训是在用户尚未描述完执行细节时就给出机制归因，容易锁定在错误方向。

量化目标未做加总校验（8月2日制订，8月31日发现）：§9每日膳食计划的三大宏量目标与总热量目标互不相容，全取上限仅 2740kcal，低于所定的 2900-3100kcal。该矛盾自 2026-08-02 存在至 2026-08-31，共 29 天未被发现，期间记录中的「热量未达标」有一部分是目标不可达造成的，不全是执行问题。发现路径为用户提供的外部 AI 分析，记录端在其上核对数据集后确认。教训是给出一组量化目标时须当场验算其能否同时成立，这与第十八条「估算须标注依据与误差」是同一类要求的两面：前者管误差，后者管自洽。

候选因素集漏项（8月31日记录，9月1日发现）：8/31 那次异常表现的候选因素只列了换鞋、气温、排精、有氧适应四项，未列当日上午的背日课——而那是全月唯一一个双课日，是当天最独特的特征。漏项导致其后的共线性判定是在一个残缺集合上做的。发现路径为用户提出"背部激活致摆臂舒展"这一第五候选。同日另有一处归因错误：记录端曾称左右平衡 bal 可反映摆臂对称性，实为触地时间的左右分配，属下肢指标，与上肢无关，是把一个字段的定义记错之后当作证据来用。教训是列候选集时应先问"当天有什么是别的日子没有的"，而不是从既有的怀疑对象里挑；引用字段作证据前须回查 _field_definitions 的原义。

用未陈述的状态补足事实空缺（9月2日记录，9月3日发现）：用户 9/1 发来两张商品页截图并说明"已下单"，记录端此后写成"坚果和花生酱都到位了"，把下单直接当成了到货，而运输这一段是自己填的。错误不止于措辞：据此得出的"卡住的不是材料"把连续未执行归因到执行意愿上，而实际上那几天材料根本不在手边，不构成"未执行"，只构成"不具备条件"——归因方向反了。与前七条的区别在于，这次被裁剪的不是证据而是事实本身：一个从未被陈述的状态被当作已知条件写进了记录，并立刻成为下一层判断的前提。教训是凡涉及用户处境的状态（是否收到、是否完成、是否仍在进行），只采信其明确陈述过的，未陈述即为未知，不得由相邻事实推定。

第八条的两次重犯（均发生于 9 月 3 日，距第八条写入不足一日）：其一，回答"手表睡眠 HRV 是怎么回事"时生成了一张双序列对比图，其中三十余个历史点是凭印象编的，只有末尾几个是真值——数据文件就在手边，未读取即输出，图已撤回。其二，看到坚果与花生酱到货照片后，未查看花生酱配料表即写下口径并称其为"纯"，实际配料为花生、白砂糖、花生油、氢化植物油、食用盐，白砂糖居第二。两次是同一个动作：事实可查而未查，用看起来合理的内容填补空缺；与第八条的区别仅在于第八条填的是用户处境，这两次填的是自己手上的数据和眼前的图片。教训是：凡可查证的，输出前必须实际读取——数据从文件里取，标签从图片里看，"看起来应该是这样"不构成依据。

「首次」与「最」字断言未经核对（9月10日全档核对）：用户指出「悬吊抬腿首次出现」有误——该判断来自数据集 flag 字段检索，而 flag 只记当天被讨论的事项，不是动作清单，用一个不完整的字段去论证「此前没有」，推理从根上不成立；同一来源写下的「正握首次」「无硬拉为背日首次」一并撤销。随后对 8/31 以来全部 flag 与 §6 各节逐条核对，凡带「首次／最高／最低／第几」的断言用脚本对数据集重算，发现硬错 6 处（蛋白首次落入区间——实际此前六日均在区间内；首次连续三日标准口径读数——8/26–8/28 已是；浅睡序列最高两处——8/6 为 76%；华为整夜近八日最低——8/28 更低；力量日峰值心率历史新高——8/21 持平），对照对象错 3 处（有氧心率前高、深睡第二低漏并列、深睡第四高实为第六），并列未标 3 处，来源超出数据集却称「记录最低」1 处，序列定义未说明 1 处，均已逐条订正并在原处保留订正标记。同一天另有两次日期实算未做（把两天后的 24km 写成「明天」），属已写进偏好的规则被违反。教训只有一条：凡「首次」「最」「第几」，写入前必须由脚本对完整字段核对一遍；字段不完整的（动作名、早餐分项、体重时刻）不得据以下「首次／最」的结论，只能写「记录中未见」并注明来源范围。

共同点　十条里有四条是同一个模式：先形成结论，再挑选或裁剪证据去支撑它——把时间线凑上去、把已降级的判据重新启用、用后发生的事解释先发生的读数。第六至第八条属另一类，都不涉及证据裁剪，但同样会让结论显得有依据：一条是根本没做校验，一组自己给出的数字互相矛盾了 29 天没被发现，且它比前五条影响更久，因为它被写进了每天执行的计划里；一条是候选集从一开始就不全，此后所有共线性判定都建在残缺集合上；一条是把一个从未被陈述的状态当作已知条件填了进去，下一层判断随即建在这个虚构的前提上。三者分别是算术自校验缺失、枚举不完全、事实空缺被自行补足。第九条不是新类型，而是第八条在写入后不足一日内的两次重犯，这说明"写进档案"本身不构成防护，真正的约束只能是输出前的一个硬动作：可查的必须实际去查。第十条是这个硬动作在另一类断言上的缺席：「首次」「最」是可以用脚本核对的，却一直凭前几天的印象写，全档核对出十四处。对抗办法有五条：把判据和口径写进数据文件本身而非留在叙述里，这样每次引用都必须面对它当初被写下时的完整条件；量化目标在给出的当场就要验算一遍；列候选因素时先问当天有什么是别的日子没有的；凡涉及用户处境的状态只采信其明确陈述过的，未陈述即为未知；凡「首次」「最」「第几」，写入前用脚本对完整字段核对，字段不完整者只写「记录中未见」并注明范围。

##   B    文献核实留档

本附录为8月8日档案瘦身时从§7迁出的文献核实全文，内容一字未删。迁出理由：§7的定位是"能反复用来指导未来训练决策的规律"，而这三块是支撑那些规律的参考资料，留在主线上会稀释决策密度。§7对应小节已保留结论索引与出处，需要查证原始核实要点、原作者自述局限时来此。维护提示：本附录只增不改；若某条文献结论被新证据推翻，修正应写在§7对应小节并注明日期，此处保留当时的核实记录，不做静默覆盖。

### 晨起单点HRV偏低的机制与睡眠惯性——三篇原始文献核实（7月19日）

背景：7/19出现与7/15方向相反的设备背离（华为整夜98ms高、Elite晨起单点68ms偏低），同时主观有"睡不够感"但身体DOMS已消失、疲劳减轻。经三篇原始文献核实，该现象有两条独立机制支撑，分别解释"单点HRV偏低"和"睡不够但不累"。

机制一·晨起测量卡在睡眠→清醒过渡期的一过性交感激增。① Boudreau et al. 2012（Chronobiology International, 29(6):757-768）是最贴合本场景的直接证据：72小时强制去同步方案分离睡眠-觉醒效应与昼夜节律效应，发现清醒相比小睡，LF/HF与LF功率显著升高、HF（副交感）显著降低、心率平均高6.5bpm；且LF/HF峰值恰在早晨、与唾液皮质醇峰值重合，清晨睡→醒转换是全天交感激活转变幅度最大的时点。这解释了晨起单点RMSSD为何特别容易被拖低——不仅是"觉醒"动作本身，还叠加清晨时段的昼夜节律因素。局限（原作者自述）：LF/HF非纯交感指标、仅反映交感迷走平衡；样本量13人、统计功效有限——与本档案"单日LF/HF噪声大、不单独下结论"一致。② Somers et al. 1993（N Engl J Med, 328:303-307）是方法学最硬的奠基证据（微神经图直接测交感放电，非HRV间接推算），证实觉醒刺激在睡眠背景下会引发交感激增（其主线发现为REM期交感飙升至清醒水平215%）；但属机制奠基，未直接测量"晨起单点HRV被拖低多少"这一具体数值。

机制二·"睡不够感"是睡眠惯性(sleep inertia)而非身体疲劳，两套系统独立。Tassi & Muzet 2000（Sleep Medicine Reviews, 4(4):341-353，该领域顶级综述，被引超450次）核实要点：醒来前的睡眠阶段是决定睡眠惯性强度最关键的因素——从深睡(SWS/N3)猛然醒来惯性最强、从N1/N2浅睡几乎无惯性、REM居中；正常8小时无睡眠剥夺时惯性一般不超过30分钟（Jewett 1999发现主观警觉度完全恢复可能需2小时）。这与本档案7/12"晨起主观40%→活动后80%"的恢复曲线在时间尺度上吻合。边界：该综述明确指出"睡眠惯性是否有昼夜节律尚无直接证据"，与机制一的HRV昼夜节律是两个独立机制，不可混为一谈。

操作结论：晨起Elite单点RMSSD偏低、但华为整夜均值高位且睡眠结构/主观恢复正常时，优先判定为"测量时机落在觉醒过渡期"的技术性拖累，不判定为真实疲劳；"睡不够但不累"是睡眠惯性（认知系统恢复滞后于身体），起床后活动20-30分钟自然消散，不影响训练决策。此结论与机制二的系统区分一致。

### 睡眠与运动员：BMJ 2021专家共识核实要点（7月26日新增）

来源：Walsh NP, Halson SL, Sargent C, et al. "Sleep and the athlete: narrative review and 2021 expert consensus recommendations." Br J Sports Med 2021;55:356-368. doi:10.1136/bjsports-2020-102025。BMJ运动医学专家共识，作者含Liverpool John Moores、澳洲天主教大学等多国机构。以下为与本档案直接相关的核实要点，含原文自述局限。

① 睡眠结构常模（PSG金标准）：年轻成年人7-9小时睡眠约含61%浅睡、16%深睡、23%REM；15岁青少年8-10小时约含57%浅睡、22%深睡、21%REM。本档案对照：华为的浅睡参考线设为<55%，比该文献常模更严格，61%浅睡按常模属年轻成年人典型值；本人深睡长期20-35%，显著高于16%常模（利好）；但REM近期多次落在8-12%（7/24=10%、7/26=9% Low），明显低于21-23%常模，而华为因参考区间设为10-30%而标注Normal——即REM才是当前偏离常模最明显的一项，与记忆巩固/情绪调节相关，对备考期意义大于浅睡百分比。重要限定：该常模来自多导睡眠图(PSG)，而本档案数据来自腕戴设备，论文表1明确指出此类设备不能准确测量睡眠分期，故两者不可直接横比，此对照仅用于说明"浅睡61%无需焦虑"，不足以反推分期数值的绝对准确性。

② 消费级可穿戴设备的系统性偏差（论文表1）：不能准确测量睡眠分期（除经专门验证）；系统性高估总睡眠时间与睡眠效率，同时低估觉醒次数与入睡后觉醒时间(WASO)；多数设备不公开算法、不提供原始数据；大量设备缺乏充分验证。本档案含义：华为的睡眠分期百分比，参考价值低于其HRV趋势（后者至少为连续量，前者是算法分类结果），进一步支持已有的"华为看趋势、Polar H10+Elite HRV看当天锚点"两轨协议。

③ 睡眠不足与呼吸道感染易感性：论文引用Cohen 2009等指出，习惯性睡眠<7小时增加呼吸道感染易感性，且睡眠不足会降低疫苗保护性免疫反应；另引Hausswirth 2014指出，存在过度反应(over-reaching)客观征象的运动员，上呼吸道感染发生率高于未过度反应者。本轮感冒(7/21晚起病)的回溯对照：起病前多夜睡眠不足7小时（7/17=6h40、7/20=6h57、7/21=6h51），入睡时间连续偏离23:00-23:30目标窗口；且7/17背日额外加练递增硬拉、7/18出现HRV跌破下限+觉醒High+LF/HF升高三线同向报警、7/19仍带残留疲劳完成含情绪性冲刺的10km。判定：受凉是明确的直接扳机，但"睡眠持续不足+训练负荷偏高+自主神经已报警"这一组合恰好构成文献描述的易感窗口，是比单一受凉更完整的解释。此为回溯性关联，非确证因果。

④ 傍晚训练与入睡延迟的结构性关联：论文指出傍晚(18:00-21:00)高强度训练/比赛通常伴随更晚的入睡时间、更短卧床时间与更少总睡眠；并指出核心体温下降或处于低位时最易入睡，体温上升或偏高时最难入睡。本档案对照：跑步固定18:00-18:30出发，而入睡时间连续两周稳定在00:01-00:42、无一日落入23:00-23:30目标窗口。推论（尚未验证）：训练时间安排可能是入睡时间长期偏晚约1小时的结构性原因之一，而非单纯自制力问题；若日程允许，将跑步时间前移可能比"晚上早放手机"更有效（后者已试过，结果为躺床挣扎近1小时）。论文另建议顺应个人时型(chronotype)安排训练与睡眠，并指出夜型者睡眠更易受困扰、早训会减少睡眠时长并升高训练前疲劳——本人作息偏夜型（稳定午夜入睡、8点左右自然醒），故清晨力量课未必是最优时段。备考期日程受图书馆开放时间约束，此条属可选优化项。

⑤ 午睡协议（Tool #3，可直接执行）：时长≤30分钟以避免进入深睡后产生睡眠惯性；最佳窗口13:00-16:00（对应午后警觉度低谷）；"咖啡午睡"为睡前即刻摄入150-200mg咖啡因再睡15-20分钟（咖啡因起效约20-30分钟，恰在醒时生效）；醒后接触明亮光线+洗脸可加速消除惯性；定闹钟时比目标时长多留约10分钟以计入入睡时间。关键例外：若本身存在夜间入睡困难，应完全避免午睡。

⑥ 咖啡因截止时间：论文引用一项涵盖58篇文献的系统综述，指出典型剂量咖啡因即使在睡前16小时摄入，仍对睡眠产生一致负面影响——延长入睡时间(SOL)、减少总睡眠时长与睡眠效率、减少慢波睡眠(深睡)、增加浅睡与觉醒。实操：16小时标准对备考期不现实，但可作为排查工具——若某日入睡异常困难，回查当日咖啡因摄入时间。

⑦ Banking sleep（Tool #4，考研可用）：在预期睡眠不足期之前主动延长睡眠可能保护表现；一项大学篮球运动员研究显示连续5-7周每晚卧床10小时改善了反应时、冲刺、情绪与罚球命中率；论文指出储蓄睡眠不必持续数月，即使1周亦被证明可改善表现，且其价值之一是缓解赛前焦虑（知道前期睡够，就不会因赛前一晚没睡好而慌）。迁移到考研初试：考前1-2周主动拉长睡眠，比考前一晚临时要求自己"必须睡好"更可靠（后者常适得其反）。局限（原文自述）：此类研究常缺对照组，且无法区分是"真正储蓄睡眠"还是"仅偿还既有睡眠债"。

⑧ 监测设备的心理副作用（Box 3第5条）：论文警示部分运动员会过度关注睡眠监测数据，反而增加睡眠焦虑并导致睡眠更差，引用Baron等2017年提出的"Orthosomnia"（为追求完美睡眠评分而产生的睡眠焦虑，本身成为失眠诱因）。本档案适用性评估（经7月26日讨论修正）：初次评估曾据此提示本人可能存在该倾向，但被有效反驳并已收回大部分——真正被数据焦虑支配者不会在HRV未崩、症状明确指向"应停"时仍连续两日坚持训练（7/23、7/25），本人模式为"数据驱动而非以数据为导向"，决策权始终在本人手上、有时压过数据与建议。保留的可用部分：论文建议实践者权衡监测利弊并有能力调整反馈方式——落地做法是忽略华为的"睡眠评分"与自动标红提示，只看档案自定义指标（HRV相对个人基线偏移、深睡连续性、觉醒次数），减少无关信息干扰。

⑨ 浅睡偏高的归因修正（7月26日讨论）：初次分析将本轮浅睡偏高主要归因于"华为阈值比常模严格"，被指出遗漏两个更近因的混杂变量——感冒期气道不适/夜间黏膜干燥打断睡眠连续性、贵阳夜间高温破坏既有热环境入睡适应（7/23已明确记录"有点热、挣扎近1小时方入睡"）。但反向核查发现：7/16轻睡61% High、7/20轻睡68% High，两次均发生在7/21晚起病之前，说明浅睡偏高在病前已间歇出现，非本轮感冒独有。修正后结论：本人存在一个偏高的浅睡基线（大概率与入睡时间稳定偏晚相关），感冒与高温在此基线上叠加了一层，三者共同作用。此修正不改变"无需为61%焦虑"的结论，但不能简化为单一的阈值问题。

### HRV的自主神经与情绪调节理论基础（五篇原始文献核实，7月21日）

背景与边界：应用户备考需要，核实了五篇HRV基础文献原始PDF全文（非二手转述）：Appelhans & Luecken 2006（Review of General Psychology, 10(3):229-240）、Porges 2007《The Polyvagal Perspective》（Biological Psychology, 74:116-143）、Thayer & Lane 2000《A model of neurovisceral integration》（Journal of Affective Disorders, 61:201-216）、Kreibig 2010《ANS activity in emotion: A review》（Biological Psychology, 84:394-421）、Laborde, Mosley & Thayer 2017（Frontiers in Psychology, 8:213）。关键定位（避免张冠李戴）：这五篇属于"HRV作为自主神经/情绪调节指标"体系，回答的是"设备测的这个数本质是什么、机制在哪、怎么测才准"，不是"该怎么练"。训练量决策仍属另一支运动科学文献（Buchheit / Plews / Le Meur一脉，本档案§7其他小节已在用），两个体系不可混用。本小节不推翻既有认知，而是给档案里若干分散的机制注脚补上统一的理论根系。

机制根系一·前额叶抑制回路（Thayer神经内脏整合模型，争议小、被脑成像反复验证）：HRV反映的是"前额叶皮层→中枢自主网络（CAN：前扣带回/岛叶/杏仁核/下丘脑→孤束核/疑核/延髓腹外侧区）→迷走神经→心脏"这条抑制性负反馈回路的完整性。前额叶通过该回路对心脏和杏仁核施加张力性抑制；抑制运转良好时执行功能/情绪调节/应激恢复更佳，回路被削弱（疲劳、担忧、急性应激）时交感"脱抑制"冒出、HRV下降。这条直接解释了本档案反复观察到的"心理应激能独立于肌肉疲劳压低HRV"（如6/27母亲手术32ms、7/20电话应激）——心理应激直接占用/削弱前额叶抑制回路本身，故可完全独立于任何外周肌肉疲劳去压低HRV。Kreibig 2010从情绪特异性角度佐证：情绪状态确有可测量的自主神经印记，故"心理应激污染样本"有实证基础而非主观臆断。

机制根系二·光电vs ECG的脉搏传导时间机制（补强既有"光电vs ECG测量差异"小节，Laborde 2017）：PPG（光电，华为Watch 5原理）测的是脉搏波到达外周的时间，即脉搏间期=心搏间期+脉搏传导时间（PTT）；ECG（Polar H10原理）直接抓R波，无此混入。关键：应激会改变动脉弹性→改变PTT→污染PPG读数，因此PPG在静息可用、在应激/冲刺状态下不可靠。这为本档案既有的"两设备在冲刺/回落瞬间偏离最大、稳态时接近"提供了独立于"算法平滑滞后"的第二重机制解释：不只是光电算法平滑，还有PTT在应激下被生理性污染。原文并给出RMSSD精度对照——胸带ECG对比金标准误差约2.16%，腕部PPG约17.49%，与本档案两轨并行协议底层精度依据一致。

机制根系三·LF/HF"交感-迷走平衡"说已被否定（补强既有Elite HRV解析规则，Porges 2007 / Billman 2013 / Eckberg 1997，Laborde 2017转述）：LF对阿托品（迷走阻断）极度敏感，阻断迷走可几乎消除LF——若LF为纯交感标志，不应被迷走阻断消掉；且LF与交感神经活动关系松散，交感与迷走呈非线性、非互反关系，单一比值无法干净表征"平衡"。Laborde指出约65%的HRV论文仍在错误地基于LF/HF下结论。据此对既有措辞做收紧（结论不变、机制叙述更严谨）：涉及7/20 LF/HF=4.54的解读，表述宜从任何"交感主导"暗示改为"一次强烈的自主神经扰动事件"，不指定具体通路；本档案既有"LF/HF仅看长期趋势、不解读单日值"的立场因此获得权威背书，继续保持。

机制根系四·呼吸不做常规校正（Laborde 2017 / Thayer 2011）：静息自然呼吸下不对HRV做常规呼吸校正——呼吸与HRV有共同中枢神经起源（脑干心肺耦合），强行减去呼吸影响会连带删掉真正关心的神经变异；但需监测呼吸落在9–24次/分（对应HF 0.15–0.40Hz）区间内，呼吸过慢（如慢呼吸<9次/分）会把变异推入LF频段、使HF不再等于迷走张力。本档案晨测采自然呼吸，与此一致；附带确认RMSSD受呼吸影响小于HF，故以RMSSD为核心锚点的选择在方法学上稳健。超短时长补充：Munoz 2015（N=3387）显示测RMSSD无需超过120秒，单次10秒标准ECG即可得有效RMSSD（多段取平均更佳）——仅对时域RMSSD成立，频域仍需≥1分钟。

实测案例（8月1日）：晨测时因sleep inertia未消退，用户主动进行了缓慢深呼吸，导致LF peak降至0.059Hz（约3.5次/分，远低于9-24次/分的正常呼吸范围），变异被人为推入LF频段，SDNN(119.23ms)/TP(8809.36ms²)/LF同步虚高失真，Elite App据此给出的"副交感异常升高、建议减量"提示不可信；RMSSD受呼吸影响较小，仍保持在基线中段，作为该次测量中相对可用的指标。操作结论：晨测前若有意放慢呼吸（无论是为平静情绪还是巧合），当日频域指标（LF/HF、LF peak、SDNN、TP）应整体降权或不采信，只用RMSSD参考基线位置。

关键局限与警示（按维护规则保留原文边界，不只写支持性结论）：① Porges多迷走理论在生理学界非定论——腹侧/背侧迷走二分、"社会参与系统"、RSA=纯疑核迷走输出等理论建构受过实质批评（最有力批评之一Grossman & Taylor发于同卷Biol Psychol 74）；其"迷走刹车/迷走撤除先于交感"等功能性描述可用，但演化等级类建构不宜当作已证事实。② Thayer与Porges在HF/LF解读上存在分歧（Thayer传统上倾向HF=纯迷走、有时谈LF/HF平衡；Porges论证LF亦迷走驱动、平衡说不成立）——本档案"LF/HF只看长期趋势"恰卡在两派分歧中间，为最稳妥立场，不因Thayer框架而回头重度解读单日LF/HF。③ "HRV越高越好"错误，五篇再次确认（Laborde举神经性贪食症患者因低代谢率反而HRV偏高为例），与本档案7/13"HRV升高≠恢复更好、功能性过度训练副交感异常偏高"同向——高HRV须结合睡眠结构/静息心率/主观体感联合判断，不孤立追高。④ 新角度（Park 2014，Laborde转述）：张力性（tonic，晨起基线）迷走张力会调节相位性（phasic，任务中）迷走撤除模式，即晨起基线水平影响当天身体应对训练刺激的调节方式——为"晨起HRV高则有余量吸收刺激"的决策哲学提供更精细支点，可作后续观察方向。
